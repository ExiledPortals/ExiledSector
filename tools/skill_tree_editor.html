<title>Skill Tree Layout Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f16;
    --panel: #121926;
    --panel-2: #0e1420;
    --line: #263140;
    --line-soft: #1a2330;
    --text: #dbe4ee;
    --text-dim: #8494a8;
    --text-faint: #566274;
    --accent: #5fd0ff;
    --accent-dim: #2c5c70;
    --small: #7c8ba0;
    --notable: #5fd0ff;
    --keystone: #ffb454;
    --wormhole: #ff5ad1;
    --root: #b98aff;
    --danger: #ff6b6b;
    --danger-dim: #4a2626;
    --success: #4ade80;
    --canvas-grid: #16202c;
    --canvas-bg: #0a0e15;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="light"]) {
      --bg: #eef1f5;
      --panel: #ffffff;
      --panel-2: #f5f7fa;
      --line: #d3dae3;
      --line-soft: #e3e8ee;
      --text: #1b2430;
      --text-dim: #5c6b7d;
      --text-faint: #93a1b0;
      --accent: #0d84ad;
      --accent-dim: #cfe9f4;
      --small: #6b7686;
      --notable: #0d84ad;
      --keystone: #b9720a;
      --wormhole: #a3168a;
      --root: #7c4dff;
      --danger: #c8393a;
      --danger-dim: #fbdede;
      --success: #16824a;
      --canvas-grid: #e2e7ed;
      --canvas-bg: #f7f9fb;
    }
  }
  :root[data-theme="light"] {
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-2: #f5f7fa;
    --line: #d3dae3;
    --line-soft: #e3e8ee;
    --text: #1b2430;
    --text-dim: #5c6b7d;
    --text-faint: #93a1b0;
    --accent: #0d84ad;
    --accent-dim: #cfe9f4;
    --small: #6b7686;
    --notable: #0d84ad;
    --keystone: #b9720a;
    --wormhole: #a3168a;
    --root: #7c4dff;
    --danger: #c8393a;
    --danger-dim: #fbdede;
    --success: #16824a;
    --canvas-grid: #e2e7ed;
    --canvas-bg: #f7f9fb;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    height: 100%;
    overflow: hidden;
  }
  html { height: 100%; }

  .app {
    display: grid;
    grid-template-columns: 240px 1fr 320px;
    grid-template-rows: 52px 1fr 1px 220px;
    grid-template-areas:
      "topbar topbar topbar"
      "toolbar canvas inspector"
      "toolbar canvas inspector"
      "toolbar export export";
    height: 100vh;
    padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  }
  @media (max-width: 860px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr auto;
      grid-template-areas:
        "topbar"
        "toolbar"
        "canvas"
        "export";
      height: auto;
      min-height: 100vh;
      overflow: auto;
    }
    #inspector { display: none; }
    #inspector.open {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 50;
      grid-area: unset;
    }
  }

  #topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #topbar h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    white-space: nowrap;
  }
  #topbar .stats {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    gap: 12px;
    font-variant-numeric: tabular-nums;
  }
  #topbar .spacer { flex: 1; }
  #searchBox {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    width: 200px;
  }
  #searchBox:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .themeToggle {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 13px;
    padding: 6px 9px;
    cursor: pointer;
  }

  #toolbar {
    grid-area: toolbar;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 14px 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative;
  }
  .panelToggle {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 5px 7px;
    flex-shrink: 0;
  }
  .panelToggle:hover { color: var(--text); border-color: var(--accent-dim); }
  #toolbar.collapsed { padding: 14px 6px; overflow: hidden; }
  #toolbar.collapsed .toolSection { display: none; }
  #inspector.collapsed { padding: 16px 6px; overflow: hidden; }
  #inspector.collapsed #inspectorBody, #inspector.collapsed .closeMobile { display: none; }
  #exportBar.collapsed .exportBody { display: none; }
  .panelHeaderRow { display: flex; align-items: center; justify-content: space-between; }
  .resizeHandle { position: absolute; z-index: 5; background: transparent; }
  .resizeHandle:hover, .resizeHandle.dragging { background: var(--accent-dim); }
  .resizeHandle-v { top: 0; bottom: 0; width: 6px; cursor: col-resize; }
  .resizeHandle-h { left: 0; right: 0; height: 6px; cursor: row-resize; }
  #toolbarResize { right: -3px; }
  #inspectorResize { left: -3px; }
  #exportResize { top: -3px; }
  #toolbar.collapsed #toolbarResize,
  #inspector.collapsed #inspectorResize,
  #exportBar.collapsed #exportResize { display: none; }
  @media (max-width: 860px) {
    .resizeHandle { display: none; }
  }
  .toolSection { display: flex; flex-direction: column; gap: 8px; }
  .toolSection .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    font-weight: 600;
  }
  .modeBtn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text-dim);
    padding: 9px 10px;
    font-family: var(--font-display);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: border-color .1s, color .1s;
  }
  .modeBtn:hover { border-color: var(--accent-dim); color: var(--text); }
  .modeBtn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--text);
  }
  .modeBtn .key {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 4px;
  }
  .hint { font-size: 11px; color: var(--text-faint); line-height: 1.5; }

  .legendRow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
  .legendDot { width: 11px; height: 11px; border-radius: 50%; flex: none; border: 1.5px solid rgba(0,0,0,.2); }

  .smallBtn {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text-dim);
    padding: 7px 9px;
    font-family: var(--font-display);
    font-size: 12px;
    cursor: pointer;
  }
  .smallBtn:hover { border-color: var(--accent-dim); color: var(--text); }
  .smallBtn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .smallBtn.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
  .smallBtn .key {
    margin-left: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 4px;
  }
  .btnRow { display: flex; gap: 6px; flex-wrap: wrap; }

  #canvasWrap {
    grid-area: canvas;
    position: relative;
    overflow: hidden;
    background: var(--canvas-bg);
  }
  #canvasWrap.mode-add { cursor: copy; }
  #canvasWrap.mode-addAnchor { cursor: crosshair; }
  svg#stage { width: 100%; height: 100%; display: block; }
  .node-circle { cursor: grab; transition: stroke-width .08s; }
  .node-circle:active { cursor: grabbing; }
  .node-label {
    font-family: var(--font-display);
    font-size: 11px;
    fill: var(--text-dim);
    pointer-events: none;
    user-select: none;
  }
  .edge-line { fill: none; stroke: var(--text-faint); stroke-width: 1.4; opacity: .55; }
  .edge-line.bad { stroke: var(--danger); opacity: .9; stroke-dasharray: 4 3; }
  .edge-line.hidden-connector { stroke-dasharray: 2 5; opacity: .3; }
  .curve-anchor { fill: var(--text-faint); opacity: .45; cursor: grab; }
  .curve-anchor:hover { fill: var(--accent); opacity: 1; }
  .curve-anchor.dragging { fill: var(--accent); opacity: 1; cursor: grabbing; }
  .orbit-ring { fill: none; stroke: var(--text-faint); stroke-width: 1.5; stroke-dasharray: 5 5; opacity: .5; }
  .orbit-ring.selected { stroke: var(--accent); opacity: .9; }
  .orbit-center { fill: var(--panel-2); stroke: var(--text-faint); stroke-width: 1.5; cursor: move; }
  .orbit-center:hover { stroke: var(--accent); }
  .orbit-center.selected { stroke: var(--accent); fill: var(--accent-dim); }
  .orbit-center.moving { stroke: var(--accent); fill: var(--accent-dim); }
  .orbit-resize { fill: var(--text-faint); opacity: .55; cursor: ew-resize; }
  .orbit-resize:hover { fill: var(--accent); opacity: 1; }
  .orbit-resize.dragging { fill: var(--accent); opacity: 1; }
  .orbit-shape-cycle { fill: var(--text-faint); opacity: .55; cursor: pointer; }
  .orbit-shape-cycle:hover { fill: var(--accent); opacity: 1; }
  .orbit-rotate { fill: var(--text-faint); opacity: .55; cursor: grab; }
  .orbit-rotate:hover { fill: var(--accent); opacity: 1; }
  .orbit-rotate.dragging { fill: var(--accent); opacity: 1; cursor: grabbing; }
  .shapeBtn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
  .center-mark { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: .8; }
  .image-placeholder { fill: var(--panel-2); stroke: var(--text-faint); stroke-width: 1; stroke-dasharray: 4 6; opacity: .5; pointer-events: none; }
  .image-center { fill: var(--panel-2); stroke: var(--text-faint); stroke-width: 1.5; cursor: move; }
  .image-center:hover { stroke: var(--accent); }
  .image-center.selected { stroke: var(--accent); fill: var(--accent-dim); }
  .image-center.moving { stroke: var(--accent); fill: var(--accent-dim); }
  .image-resize { fill: var(--text-faint); opacity: .55; cursor: nwse-resize; }
  .image-resize:hover { fill: var(--accent); opacity: 1; }
  .image-resize.dragging { fill: var(--accent); opacity: 1; }
  .image-rotate-line { stroke: var(--text-faint); stroke-width: 1; opacity: .5; pointer-events: none; }
  .image-rotate { fill: var(--text-faint); opacity: .55; cursor: grab; }
  .image-rotate:hover { fill: var(--accent); opacity: 1; }
  .image-rotate.dragging { fill: var(--accent); opacity: 1; cursor: grabbing; }
  .image-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 220px; overflow-y: auto; padding: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; }
  .image-picker-item { aspect-ratio: 1; border: 2px solid var(--line); border-radius: 4px; overflow: hidden; cursor: pointer; background: #000; display: flex; align-items: center; justify-content: center; }
  .image-picker-item:hover { border-color: var(--accent-dim); }
  .image-picker-item.selected { border-color: var(--accent); }
  .image-picker-item img { width: 100%; height: 100%; object-fit: cover; }
  .star-glow { pointer-events: none; }
  .star-body { pointer-events: none; }
  .star-center { fill: var(--panel-2); stroke: var(--text-faint); stroke-width: 1.5; cursor: move; }
  .star-center:hover { stroke: var(--accent); }
  .star-center.selected { stroke: var(--accent); fill: var(--accent-dim); }
  .star-center.moving { stroke: var(--accent); fill: var(--accent-dim); }
  .star-resize { fill: var(--text-faint); opacity: .55; cursor: nesw-resize; }
  .star-resize:hover { fill: var(--accent); opacity: 1; }
  .star-resize.dragging { fill: var(--accent); opacity: 1; }
  .marquee-rect { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; pointer-events: none; }

  .zoomControls {
    position: absolute;
    right: 14px;
    bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .zoomControls button {
    width: 30px; height: 30px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
  }
  .zoomControls button:hover { color: var(--text); border-color: var(--accent-dim); }

  .warnBadge {
    position: absolute;
    left: 14px;
    bottom: 14px;
    background: var(--panel);
    border: 1px solid var(--danger);
    color: var(--danger);
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    max-width: 360px;
    z-index: 5;
  }

  #inspector {
    grid-area: inspector;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
  }
  #inspector .closeMobile { display: none; }
  @media (max-width: 860px) {
    #inspector .closeMobile {
      display: block; align-self: flex-end;
      background: none; border: none; color: var(--text-dim);
      font-size: 20px; cursor: pointer; padding: 0;
    }
  }
  #inspector h2 {
    font-size: 13px;
    margin: 0;
    letter-spacing: .02em;
  }
  .empty-inspector { color: var(--text-faint); font-size: 12.5px; line-height: 1.6; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); }
  .field input:not([type="checkbox"]), .field select {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 9px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12.5px;
    width: 100%;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .fieldRow { display: flex; gap: 8px; }
  .fieldRow .field { flex: 1; }
  .tierPill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    font-family: var(--font-mono); width: fit-content;
    border: 1px solid var(--line);
  }
  .tagChipRow { display: flex; flex-wrap: wrap; gap: 5px; }
  .tagChip {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    font-family: var(--font-mono); cursor: pointer; user-select: none;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text-dim);
  }
  .tagChip.active { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
  .tagChip.invalid { border-color: var(--danger); color: var(--danger); }
  .tagGroupLabel { font-size: 10px; color: var(--text-faint); font-family: var(--font-mono); margin-top: 2px; }
  .prereqList { display: flex; flex-direction: column; gap: 5px; }
  .prereqRow { display: flex; align-items: center; gap: 6px; }
  .prereqItem {
    display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
    background: var(--panel-2); border: 1px solid var(--line-soft);
    border-radius: 5px; padding: 5px 8px; font-size: 12px; font-family: var(--font-mono);
  }
  .prereqItem span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prereqItem button { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 13px; line-height: 1; }
  .prereqItem button:hover { color: var(--danger); }
  .prereqRow input[type="checkbox"] { flex: none; }
  .selectableRow { cursor: pointer; }
  .selectableRow:hover { border-color: var(--accent-dim); }
  .typePickerList { display: flex; flex-direction: column; gap: 5px; max-height: 60vh; overflow-y: auto; padding: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; }
  .typePickerRow {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 6px; padding: 5px 8px;
  }
  .typePickerRow.selected { border-color: var(--accent); }
  .typePickerIcon { width: 32px; height: 32px; border-radius: 50%; background: #000; object-fit: cover; flex-shrink: 0; }
  .typePickerInfo { flex: 1; overflow: hidden; }
  .typePickerName { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .typePickerMeta { font-size: 10px; color: var(--text-faint); font-family: var(--font-mono); }
  hr.sep { border: none; border-top: 1px solid var(--line-soft); margin: 2px 0; }

  #exportBar {
    grid-area: export;
    background: var(--panel);
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .exportTabs { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  .exportTabs .spacer { flex: 1; }
  .exportTabs .panelToggle { margin-right: 10px; }
  .exportTab {
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: var(--font-mono);
  }
  .exportTab.active { color: var(--text); border-bottom-color: var(--accent); }
  .exportBody { flex: 1; display: flex; overflow: hidden; }
  .exportBody textarea {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text-dim);
    border: none;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.5;
    padding: 10px 12px;
    white-space: pre;
  }
  .exportSide {
    width: 150px;
    border-left: 1px solid var(--line);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--success);
    color: var(--success);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 20px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .toast.show { opacity: 1; }

  .modalOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px; width: min(420px, 90vw);
    display: flex; flex-direction: column; gap: 12px;
    max-height: 80vh; overflow-y: auto;
  }
  .modal.wide { width: min(900px, 95vw); }
  .modal h3 { margin: 0; font-size: 14px; }
  .modalBtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .imageBrowserLayout { display: flex; gap: 14px; align-items: flex-start; }
  .imageBrowserGrid {
    flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px;
    max-height: 60vh; overflow-y: auto; padding: 4px; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; align-content: start;
  }
  .imageBrowserGrid .image-picker-item { position: relative; }
  .imageBrowserGrid .image-picker-item .imgName {
    position: absolute; left: 0; right: 0; bottom: 0; font-size: 8px; line-height: 1.2;
    background: rgba(0,0,0,.6); color: #fff; padding: 1px 2px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
  }
  .imageBrowserDetail { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .imageBrowserPreview {
    width: 100%; aspect-ratio: 1; background: #000; border: 1px solid var(--line);
    border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .imageBrowserPreview img { max-width: 100%; max-height: 100%; }
  .imageBrowserPath { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); word-break: break-all; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

<div class="app">
  <div id="topbar">
    <h1>Skill Tree Layout Editor</h1>
    <div class="stats" id="statsLine"></div>
    <div class="spacer"></div>
    <input id="searchBox" placeholder="Search node, type name or tag..." aria-label="Search node, type name or tag">
    <button class="themeToggle" id="themeToggle" title="Toggle theme">Theme</button>
  </div>

  <div id="toolbar">
    <div class="resizeHandle resizeHandle-v" id="toolbarResize"></div>
    <div class="panelHeaderRow">
      <div class="label">Toolbar</div>
      <button class="panelToggle" id="toolbarToggle" title="Collapse/expand toolbar">&laquo;</button>
    </div>
    <div class="toolSection">
      <div class="label">Mode</div>
      <button class="modeBtn active" data-mode="select">Select / Move <span class="key">A</span></button>
      <button class="modeBtn" data-mode="add">Add Node <span class="key">S</span></button>
      <button class="modeBtn" data-mode="addAnchor">Add Anchor <span class="key">D</span></button>
      <div class="btnRow" id="anchorShapeRow">
        <button class="smallBtn shapeBtn active" data-anchor-shape="circle">Circle</button>
        <button class="smallBtn shapeBtn" data-anchor-shape="square">Square</button>
        <button class="smallBtn shapeBtn" data-anchor-shape="triangle">Triangle</button>
        <button class="smallBtn shapeBtn" data-anchor-shape="rectangle">Rectangle</button>
        <button class="smallBtn shapeBtn" data-anchor-shape="asteroidBelt">Asteroid Belt</button>
      </div>
      <button class="modeBtn" data-mode="addImage">Add Image <span class="key">F</span></button>
      <button class="modeBtn" data-mode="addStar">Add Star <span class="key">G</span></button>
    </div>

    <div class="toolSection">
      <div class="label">Tiers</div>
      <div class="legendRow"><span class="legendDot" style="background:var(--small)"></span>Small</div>
      <div class="legendRow"><span class="legendDot" style="background:var(--notable)"></span>Notable</div>
      <div class="legendRow"><span class="legendDot" style="background:var(--keystone)"></span>Keystone</div>
      <div class="legendRow"><span class="legendDot" style="background:var(--wormhole)"></span>Wormhole</div>
      <div class="legendRow"><span class="legendDot" style="background:var(--root)"></span>Root (ship start)</div>
      <label class="legendRow" for="labelsToggle" style="cursor:pointer"><input type="checkbox" id="labelsToggle" checked> Show labels</label>
    </div>

    <div class="toolSection">
      <div class="label">View</div>
      <div class="btnRow">
        <button class="smallBtn" id="fitBtn">Fit to screen</button>
        <button class="smallBtn" id="centerBtn">Center on origin</button>
      </div>
    </div>

    <div class="toolSection">
      <div class="label">Data</div>
      <div class="btnRow">
        <button class="smallBtn" id="importBtn">Import JSON...</button>
        <button class="smallBtn danger" id="resetBtn">Reload from disk</button>
      </div>
    </div>

    <div class="toolSection">
      <div class="label">Images</div>
      <div class="btnRow">
        <button class="smallBtn" id="imageEditorBtn">Image Editor...</button>
      </div>
    </div>
  </div>

  <div id="canvasWrap" class="mode-select">
    <svg id="stage"></svg>
    <div class="zoomControls">
      <button id="zoomIn">+</button>
      <button id="zoomOut">-</button>
    </div>
    <div class="warnBadge" id="warnBadge" style="display:none"></div>
  </div>

  <div id="inspector">
    <div class="resizeHandle resizeHandle-v" id="inspectorResize"></div>
    <div class="panelHeaderRow">
      <button class="panelToggle" id="inspectorToggle" title="Collapse/expand inspector">&raquo;</button>
      <button class="closeMobile" id="closeInspector">X</button>
    </div>
    <div id="inspectorBody"><div class="empty-inspector">Select a node to see and edit its details, or switch to Add mode and click the canvas to place a new one.</div></div>
  </div>

  <div id="exportBar">
    <div class="resizeHandle resizeHandle-h" id="exportResize"></div>
    <div class="exportTabs">
      <div class="exportTab active" data-tab="tree">ship_skill_tree.json</div>
      <div class="exportTab" data-tab="types">skill_types.json</div>
      <div class="spacer"></div>
      <button class="panelToggle" id="exportToggle" title="Collapse/expand file panel">&or;</button>
    </div>
    <div class="exportBody">
      <textarea id="exportText" readonly spellcheck="false" aria-label="Exported file contents"></textarea>
      <div class="exportSide">
        <button class="smallBtn primary" id="saveToProjectBtn">Save to project</button>
        <button class="smallBtn primary" id="copyBtn">Copy</button>
        <button class="smallBtn" id="refreshExportBtn">Regenerate</button>
        <div class="hint" id="exportHint"></div>
      </div>
    </div>
  </div>
</div>

function curveKey(a, b){ return a < b ? a + '|' + b : b + '|' + a; }
function findCurve(a, b){
  var key = curveKey(a, b);
  for (var i=0;i<state.curves.length;i++) if (curveKey(state.curves[i].a, state.curves[i].b) === key) return state.curves[i];
  return null;
}
function defaultControlPoint(a, b){
  var na = nodeById(a), nb = nodeById(b);
  if (!na || !nb) return { x: 0, y: 0 };
  return { x: (na.x + nb.x) / 2, y: (na.y + nb.y) / 2 };
}
function controlPointFor(a, b){
  var c = findCurve(a, b);
  return c ? { x: c.controlX, y: c.controlY } : defaultControlPoint(a, b);
}
function bezierHandleFor(throughPoint, ax, ay, bx, by){
  return { x: 2*throughPoint.x - (ax+bx)/2, y: 2*throughPoint.y - (ay+by)/2 };
}
function setCurveControl(a, b, x, y){
  var c = findCurve(a, b);
  if (c) { c.controlX = x; c.controlY = y; }
  else { state.curves.push({ a: a, b: b, controlX: x, controlY: y }); }
}
function removeCurve(a, b){
  var key = curveKey(a, b);
  state.curves = state.curves.filter(function(c){ return curveKey(c.a, c.b) !== key; });
}
function removeCurvesForNode(id){
  state.curves = state.curves.filter(function(c){ return c.a !== id && c.b !== id; });
}
function isConnectorHidden(a, b){
  var key = curveKey(a, b);
  return state.hiddenConnectors.some(function(h){ return curveKey(h.a, h.b) === key; });
}
function toggleConnectorHidden(a, b){
  if (isConnectorHidden(a, b)) {
    var key = curveKey(a, b);
    state.hiddenConnectors = state.hiddenConnectors.filter(function(h){ return curveKey(h.a, h.b) !== key; });
  } else {
    state.hiddenConnectors.push({ a: a, b: b });
  }
}
function removeHiddenConnectorsForNode(id){
  state.hiddenConnectors = state.hiddenConnectors.filter(function(h){ return h.a !== id && h.b !== id; });
}
function snapCurveToStraightIfClose(a, b){
  var c = findCurve(a, b);
  if (!c) return;
  var def = defaultControlPoint(a, b);
  var dx = c.controlX - def.x, dy = c.controlY - def.y;
  if (Math.sqrt(dx*dx + dy*dy) < 8) removeCurve(a, b);
}

var ORBIT_SNAP_RADIUS = 18;
var ORBIT_DETACH_RADIUS = 45;
var ORBIT_CARDINAL_SNAP_DEGREES = 6;
var ORBIT_CARDINAL_ANGLES = [0, 90, 180, 270];

function anchorById(id){ for (var i=0;i<state.anchors.length;i++) if (state.anchors[i].id === id) return state.anchors[i]; return null; }
function uniqueAnchorId(){

  return id;
}
var ANCHOR_SHAPES = ['circle', 'square', 'triangle', 'rectangle', 'asteroidBelt'];
var ANCHOR_SHAPE_LABELS = { circle: 'Circle', square: 'Square', triangle: 'Triangle', rectangle: 'Rectangle', asteroidBelt: 'Asteroid Belt' };
var RING_BELT_STYLES = [
  { id: 'asteroids', label: 'Asteroids' },
  { id: 'ice', label: 'Ice' },
  { id: 'dust', label: 'Dust' },
  { id: 'special', label: 'Special' }
];
var AURORA_RING_BELT_PATH = 'graphics/planets/aurorae.png';
var KEYSTONE_BELT_DEFAULT_WIDTH = 1.1;
function isAuroraBelt(n){
  return n.ringBeltPath === AURORA_RING_BELT_PATH;
}
var ANCHOR_RECTANGLE_ASPECT = 1.6;
function anchorShapeVertices(anchor){
  var shape = anchor.shape || 'circle';
  var r = anchor.radius;
  var localVerts;
  if (shape === 'square'){
    var h = r / Math.SQRT2;
    localVerts = [{ x: -h, y: -h }, { x: h, y: -h }, { x: h, y: h }, { x: -h, y: h }];
  } else if (shape === 'rectangle'){
    var ratio = anchor.aspectRatio || ANCHOR_RECTANGLE_ASPECT;
    var halfH = r / Math.sqrt(1 + ratio * ratio);
    var halfW = ratio * halfH;
    localVerts = [{ x: -halfW, y: -halfH }, { x: halfW, y: -halfH }, { x: halfW, y: halfH }, { x: -halfW, y: halfH }];
  } else if (shape === 'triangle'){
    localVerts = [-90, 30, 150].map(function(a){
      var rad = a * Math.PI / 180;
      return { x: r * Math.cos(rad), y: r * Math.sin(rad) };
    });
  } else {
    return null;
  }
  var rot = (anchor.rotation || 0) * Math.PI / 180;
  var cos = Math.cos(rot), sin = Math.sin(rot);
  return localVerts.map(function(v){
    return { x: anchor.x + v.x * cos - v.y * sin, y: anchor.y + v.x * sin + v.y * cos };
  });
}
function rayPolygonIntersection(cx, cy, angleDeg, vertices){
  var rad = angleDeg * Math.PI / 180;
  var dx = Math.cos(rad), dy = Math.sin(rad);
  for (var i = 0; i < vertices.length; i++){
    var a = vertices[i], b = vertices[(i + 1) % vertices.length];
    var v1x = cx - a.x, v1y = cy - a.y;
    var v2x = b.x - a.x, v2y = b.y - a.y;
    var v3x = -dy, v3y = dx;
    var denom = v2x * v3x + v2y * v3y;
    if (Math.abs(denom) < 1e-9) continue;
    var t1 = (v2x * v1y - v2y * v1x) / denom;
    var t2 = (v1x * v3x + v1y * v3y) / denom;
    if (t1 >= 0 && t2 >= 0 && t2 <= 1) return { x: cx + dx * t1, y: cy + dy * t1 };
  }
  return { x: cx, y: cy };
}
function positionOnAnchor(anchor, angleDeg){
  var verts = anchorShapeVertices(anchor);
  if (verts) return rayPolygonIntersection(anchor.x, anchor.y, angleDeg, verts);
  var rad = angleDeg * Math.PI / 180;
  return { x: anchor.x + Math.cos(rad) * anchor.radius, y: anchor.y + Math.sin(rad) * anchor.radius };
}
function snapAngleToTargets(angleDeg, targets){
  var norm = ((angleDeg % 360) + 360) % 360;
  for (var i=0;i<targets.length;i++){
    var target = ((targets[i] % 360) + 360) % 360;
    var diff = Math.abs(norm - target);
    diff = Math.min(diff, 360 - diff);
    if (diff <= ORBIT_CARDINAL_SNAP_DEGREES) return targets[i];
  }
  return angleDeg;
}
function anchorSnapAngles(anchor){
  var verts = anchorShapeVertices(anchor);
  if (!verts) return ORBIT_CARDINAL_ANGLES;
  var corners = verts.map(function(v){ return Math.atan2(v.y - anchor.y, v.x - anchor.x) * 180 / Math.PI; });
  return ORBIT_CARDINAL_ANGLES.concat(corners);
}
function snapNodeToAnchor(n, anchor, worldX, worldY){
  var angleDeg = Math.atan2(worldY - anchor.y, worldX - anchor.x) * 180 / Math.PI;
  angleDeg = snapAngleToTargets(angleDeg, anchorSnapAngles(anchor));
  var pos = positionOnAnchor(anchor, angleDeg);
  n.x = Math.round(pos.x);
  n.y = Math.round(pos.y);
  n.orbitAnchorId = anchor.id;
  n.orbitAngle = angleDeg;
  syncRingArcCurves(anchor);
}
function detachNodeFromAnchor(n){
  delete n.orbitAnchorId;
  delete n.orbitAngle;
}

var ALIGN_SNAP_THRESHOLD = 10;
function computeAlignmentSnap(node, tentativeX, tentativeY){
  var neighbors = node.connectedTo.map(nodeById).filter(function(n){ return n; });
  if (neighbors.length === 0) return null;

  var best = null, bestDist = ALIGN_SNAP_THRESHOLD;
  function consider(px, py){
    var dist = Math.sqrt((tentativeX-px)*(tentativeX-px) + (tentativeY-py)*(tentativeY-py));
    if (dist < bestDist){ bestDist = dist; best = { x: px, y: py }; }
  }
  for (var i = 0; i < neighbors.length; i++){
    for (var j = i + 1; j < neighbors.length; j++){
      var a = neighbors[i], b = neighbors[j];
      var ldx = b.x - a.x, ldy = b.y - a.y;
      var lenSq = ldx*ldx + ldy*ldy;
      if (lenSq < 1) continue;
      var t = ((tentativeX - a.x) * ldx + (tentativeY - a.y) * ldy) / lenSq;
      consider(a.x + t * ldx, a.y + t * ldy);

      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var pdx = -ldy, pdy = ldx;
      var pt = ((tentativeX - mx) * pdx + (tentativeY - my) * pdy) / lenSq;
      consider(mx + pt * pdx, my + pt * pdy);
    }
  }
  if (best) return best;

  var bestX = null, bestXDist = ALIGN_SNAP_THRESHOLD;
  var bestY = null, bestYDist = ALIGN_SNAP_THRESHOLD;
  neighbors.forEach(function(n){
    var dx = Math.abs(tentativeX - n.x);
    if (dx < bestXDist){ bestXDist = dx; bestX = n.x; }
    var dy = Math.abs(tentativeY - n.y);
    if (dy < bestYDist){ bestYDist = dy; bestY = n.y; }
  });
  if (bestX !== null || bestY !== null){
    return { x: bestX !== null ? bestX : tentativeX, y: bestY !== null ? bestY : tentativeY };
  }
  return null;
}
function resyncNodesOnAnchor(anchor){
  state.nodes.forEach(function(n){
    if (n.orbitAnchorId !== anchor.id) return;
    var pos = positionOnAnchor(anchor, n.orbitAngle || 0);
    n.x = Math.round(pos.x);
    n.y = Math.round(pos.y);
  });
  syncRingArcCurves(anchor);
}
function ringArcThroughPoint(anchor, angleA, angleB){
  var diff = ((angleB - angleA + 180) % 360 + 360) % 360 - 180;
  return positionOnAnchor(anchor, angleA + diff / 2);
}
function syncRingArcCurves(anchor){
  var onRing = state.nodes.filter(function(n){ return n.orbitAnchorId === anchor.id; });
  onRing.forEach(function(n){
    (n.connectedTo||[]).forEach(function(pid){
      if (n.id >= pid) return;
      var other = nodeById(pid);
      if (!other || other.orbitAnchorId !== anchor.id) return;
      var pt = ringArcThroughPoint(anchor, n.orbitAngle, other.orbitAngle);
      setCurveControl(n.id, pid, Math.round(pt.x), Math.round(pt.y));
    });
  });
}
function deleteAnchor(id){
  state.anchors = state.anchors.filter(function(a){ return a.id !== id; });
  state.nodes.forEach(function(n){ if (n.orbitAnchorId === id) detachNodeFromAnchor(n); });
}

function worldToScreenTransform(){
  var rect = canvasWrap.getBoundingClientRect();
  var cx = rect.width / 2 + state.view.panX;
  var cy = rect.height / 2 + state.view.panY;
  return 'translate(' + cx + ',' + cy + ') scale(' + state.view.zoom + ')';
}
function screenPointToWorld(clientX, clientY){
  var rect = canvasWrap.getBoundingClientRect();
  var rx = clientX - rect.left, ry = clientY - rect.top;
  var cx = rect.width / 2 + state.view.panX;
  var cy = rect.height / 2 + state.view.panY;
  var wx = (rx - cx) / state.view.zoom;
  var wyScreen = (ry - cy) / state.view.zoom;
  return { x: wx, y: wyScreen };
}
function worldToScreenXY(x, y){ return { sx: x, sy: y }; }

function validate(){
  var issues = [];
  var idCount = {};
  state.nodes.forEach(function(n){ idCount[n.id] = (idCount[n.id]||0) + 1; });
  Object.keys(idCount).forEach(function(id){ if (idCount[id] > 1) issues.push('Duplicate node id: ' + id); });
  state.nodes.forEach(function(n){
    if (!typeById(n.type)) issues.push('Node "' + n.id + '" uses unknown type "' + n.type + '"');
    (n.connectedTo||[]).forEach(function(p){
      if (!nodeById(p)) issues.push('Node "' + n.id + '" connection "' + p + '" does not exist');
    });
  });
  state.nodes.forEach(function(n){
    if (tierOf(typeById(n.type)) !== 'WORMHOLE') return;
    if (!n.pairedWith) { issues.push('Wormhole node "' + n.id + '" has no paired wormhole set'); return; }
    if (n.pairedWith === n.id) { issues.push('Wormhole node "' + n.id + '" is paired with itself'); return; }
    var paired = nodeById(n.pairedWith);
    if (!paired) { issues.push('Wormhole node "' + n.id + '" is paired with "' + n.pairedWith + '", which does not exist'); return; }
    if (tierOf(typeById(paired.type)) !== 'WORMHOLE') { issues.push('Wormhole node "' + n.id + '" is paired with "' + n.pairedWith + '", which is not a wormhole-tier node'); return; }
    if (paired.pairedWith !== n.id) { issues.push('Wormhole node "' + n.id + '" is paired with "' + n.pairedWith + '", but that node is paired with "' + (paired.pairedWith || 'nothing') + '" instead'); }
  });
  return issues.concat(validateTags());
}

function validateTags(){
  var issues = [];
  state.nodes.forEach(function(n){
    var nodeTags = n.tags || [];
    var regionCount = nodeTags.filter(isRegionTag).length;
    if (regionCount === 0) issues.push('Node "' + n.id + '" has no region tag');
    else if (regionCount > 1) issues.push('Node "' + n.id + '" has ' + regionCount + ' region tags (' + nodeTags.filter(isRegionTag).join(', ') + '), needs exactly one');
    nodeTags.forEach(function(tag){
      if (ALL_TAGS.indexOf(tag) === -1) issues.push('Node "' + n.id + '" has unknown tag "' + tag + '"');
    });
  });
  state.types.forEach(function(t){
    (t.tags || []).forEach(function(tag){
      if (ALL_TAGS.indexOf(tag) === -1) issues.push('Type "' + t.id + '" has unknown tag "' + tag + '"');
      else if (isRegionTag(tag)) issues.push('Type "' + t.id + '" carries region tag "' + tag + '", region tags belong on nodes');
    });
  });
  return issues;
}

function render(){
  buildLayers();
  layerRoot.setAttribute('transform', worldToScreenTransform());

  state.stars.forEach(function(s){
    var selected = state.selectedStarIds.indexOf(s.id) !== -1;
    var color = s.color || '#fff2c0';

    var glow = document.createElementNS(NS, 'circle');
    glow.setAttribute('cx', s.x); glow.setAttribute('cy', s.y); glow.setAttribute('r', s.radius * 3);
    glow.setAttribute('class', 'star-glow');
    glow.setAttribute('fill', color);
    glow.setAttribute('fill-opacity', '0.12');
    layerStars.appendChild(glow);

    var body = document.createElementNS(NS, 'circle');
    body.setAttribute('cx', s.x); body.setAttribute('cy', s.y); body.setAttribute('r', s.radius);
    body.setAttribute('class', 'star-body');
    body.setAttribute('fill', color);
    body.setAttribute('fill-opacity', '0.85');
    layerStars.appendChild(body);

    if (state.mode === 'select' || state.mode === 'addStar') {
      var isMoving = isDragMovingId(drag && drag.origStarPositions, s.id);
      var center = document.createElementNS(NS, 'circle');
      center.setAttribute('cx', s.x); center.setAttribute('cy', s.y); center.setAttribute('r', isMoving ? 8 : 6);
      center.setAttribute('class', 'star-center' + (selected ? ' selected' : '') + (isMoving ? ' moving' : ''));
      center.dataset.starId = s.id;
      layerStarHandles.appendChild(center);

      if (selected) {
        var isResizing = drag && drag.starResize === s.id;
        var resizeHandle = document.createElementNS(NS, 'circle');
        resizeHandle.setAttribute('cx', s.x + s.radius); resizeHandle.setAttribute('cy', s.y);
        resizeHandle.setAttribute('r', isResizing ? 7 : 5);
        resizeHandle.setAttribute('class', 'star-resize' + (isResizing ? ' dragging' : ''));
        resizeHandle.dataset.starResizeId = s.id;
        layerStarHandles.appendChild(resizeHandle);
      }
    }
  });

  state.images.forEach(function(img){
    var selected = state.selectedImageIds.indexOf(img.id) !== -1;
    var rot = img.rotation || 0;
    var x0 = img.x - img.width / 2, y0 = img.y - img.height / 2;
    var rotateAttr = rot ? ('rotate(' + rot + ' ' + img.x + ' ' + img.y + ')') : null;

    if (img.imagePath) {
      var el = document.createElementNS(NS, 'image');
      el.setAttributeNS('http://www.w3.org/1999/xlink', 'href', img.imagePath);
      el.setAttribute('href', img.imagePath);
      el.setAttribute('x', x0); el.setAttribute('y', y0);
      el.setAttribute('width', img.width); el.setAttribute('height', img.height);
      el.setAttribute('pointer-events', 'none');
      if (rotateAttr) el.setAttribute('transform', rotateAttr);
      layerImages.appendChild(el);
    } else {
      var placeholder = document.createElementNS(NS, 'rect');
      placeholder.setAttribute('x', x0); placeholder.setAttribute('y', y0);
      placeholder.setAttribute('width', img.width); placeholder.setAttribute('height', img.height);
      placeholder.setAttribute('class', 'image-placeholder');
      if (rotateAttr) placeholder.setAttribute('transform', rotateAttr);
      layerImages.appendChild(placeholder);
    }

    if (state.mode === 'select' || state.mode === 'addImage') {
      var isMoving = isDragMovingId(drag && drag.origImagePositions, img.id);
      var center = document.createElementNS(NS, 'circle');
      center.setAttribute('cx', img.x); center.setAttribute('cy', img.y); center.setAttribute('r', isMoving ? 8 : 6);
      center.setAttribute('class', 'image-center' + (selected ? ' selected' : '') + (isMoving ? ' moving' : ''));
      center.dataset.imageId = img.id;
      layerImageHandles.appendChild(center);

      if (selected) {
        var isResizing = drag && drag.imageResize === img.id;
        var cornerLocal = rotateAroundOrigin(img.width / 2, img.height / 2, rot);
        var handlePos = { x: img.x + cornerLocal.x, y: img.y + cornerLocal.y };
        var resizeHandle = document.createElementNS(NS, 'circle');
        resizeHandle.setAttribute('cx', handlePos.x); resizeHandle.setAttribute('cy', handlePos.y);
        resizeHandle.setAttribute('r', isResizing ? 7 : 5);
        resizeHandle.setAttribute('class', 'image-resize' + (isResizing ? ' dragging' : ''));
        resizeHandle.dataset.imageResizeId = img.id;
        layerImageHandles.appendChild(resizeHandle);

        var isRotating = drag && drag.imageRotate === img.id;
        var rotateLocal = rotateAroundOrigin(0, -(img.height / 2) - 24, rot);
        var rotatePos = { x: img.x + rotateLocal.x, y: img.y + rotateLocal.y };
        var rotateLine = document.createElementNS(NS, 'line');
        rotateLine.setAttribute('x1', img.x); rotateLine.setAttribute('y1', img.y);
        rotateLine.setAttribute('x2', rotatePos.x); rotateLine.setAttribute('y2', rotatePos.y);
        rotateLine.setAttribute('class', 'image-rotate-line');
        layerImageHandles.appendChild(rotateLine);
        var rotateHandle = document.createElementNS(NS, 'circle');
        rotateHandle.setAttribute('cx', rotatePos.x); rotateHandle.setAttribute('cy', rotatePos.y);
        rotateHandle.setAttribute('r', isRotating ? 7 : 5);
        rotateHandle.setAttribute('class', 'image-rotate' + (isRotating ? ' dragging' : ''));
        rotateHandle.dataset.imageRotateId = img.id;
        layerImageHandles.appendChild(rotateHandle);
      }
    }
  });

  var centerMark = document.createElementNS(NS, 'path');
  var s = 14;
  centerMark.setAttribute('d', 'M ' + (-s) + ' 0 L 0 ' + (-s) + ' L ' + s + ' 0 L 0 ' + s + ' Z');
  centerMark.setAttribute('class', 'center-mark');
  layerEdges.appendChild(centerMark);

  state.anchors.forEach(function(a){
    var selected = state.selectedAnchorIds.indexOf(a.id) !== -1;
    var verts = anchorShapeVertices(a);
    var ring;
    if (verts) {
      ring = document.createElementNS(NS, 'polygon');
      ring.setAttribute('points', verts.map(function(v){ return v.x + ',' + v.y; }).join(' '));
    } else {
      ring = document.createElementNS(NS, 'circle');
      ring.setAttribute('cx', a.x); ring.setAttribute('cy', a.y); ring.setAttribute('r', a.radius);
    }
    ring.setAttribute('class', 'orbit-ring' + (selected ? ' selected' : ''));
    layerAnchors.appendChild(ring);

    if (state.mode === 'select' || state.mode === 'addAnchor') {
      var isMoving = isDragMovingId(drag && drag.origAnchorPositions, a.id);
      var center = document.createElementNS(NS, 'circle');
      center.setAttribute('cx', a.x); center.setAttribute('cy', a.y); center.setAttribute('r', isMoving ? 8 : 6);
      center.setAttribute('class', 'orbit-center' + (selected ? ' selected' : '') + (isMoving ? ' moving' : ''));
      center.dataset.anchorId = a.id;
      layerAnchorHandles.appendChild(center);

      var shapeHandlePos = { x: a.x - a.radius / 2, y: a.y };
      var shapeHandle = document.createElementNS(NS, 'rect');
      shapeHandle.setAttribute('x', shapeHandlePos.x - 5); shapeHandle.setAttribute('y', shapeHandlePos.y - 5);
      shapeHandle.setAttribute('width', 10); shapeHandle.setAttribute('height', 10);
      shapeHandle.setAttribute('class', 'orbit-shape-cycle');
      shapeHandle.dataset.anchorShapeCycleId = a.id;
      layerAnchorHandles.appendChild(shapeHandle);

      if (selected) {
        var isResizing = drag && drag.anchorResize === a.id;
        var handlePos = { x: a.x + a.radius / 2, y: a.y };
        var resizeHandle = document.createElementNS(NS, 'circle');
        resizeHandle.setAttribute('cx', handlePos.x); resizeHandle.setAttribute('cy', handlePos.y);
        resizeHandle.setAttribute('r', isResizing ? 7 : 5);
        resizeHandle.setAttribute('class', 'orbit-resize' + (isResizing ? ' dragging' : ''));
        resizeHandle.dataset.anchorResizeId = a.id;
        layerAnchorHandles.appendChild(resizeHandle);

        if (verts) {
          var isRotating = drag && drag.anchorRotate === a.id;
          var rotatePos = positionOnAnchor(a, (a.rotation || 0) - 90);
          var rotateHandle = document.createElementNS(NS, 'circle');
          rotateHandle.setAttribute('cx', rotatePos.x); rotateHandle.setAttribute('cy', rotatePos.y);
          rotateHandle.setAttribute('r', isRotating ? 7 : 5);
          rotateHandle.setAttribute('class', 'orbit-rotate' + (isRotating ? ' dragging' : ''));
          rotateHandle.dataset.anchorRotateId = a.id;
          layerAnchorHandles.appendChild(rotateHandle);
        }
      }
    }
  });

  var q = state.search.trim().toLowerCase();
  var matchIds = null;
  if (q) {
    matchIds = {};
    state.nodes.forEach(function(n){
      var t = typeById(n.type);
      var name = t ? t.name : n.type;
      var tagText = (n.tags || []).concat(t && t.tags ? t.tags : []).join(' ').toLowerCase();
      if (n.id.toLowerCase().indexOf(q) !== -1 || (name||'').toLowerCase().indexOf(q) !== -1 || tagText.indexOf(q) !== -1) matchIds[n.id] = true;
    });
  }

  var badIds = {};
  state.nodes.forEach(function(n){
    (n.connectedTo||[]).forEach(function(p){ if (!nodeById(p)) badIds[n.id] = true; });
    if (!typeById(n.type)) badIds[n.id] = true;
  });

  state.nodes.forEach(function(n){
    var pos = worldToScreenXY(n.x, n.y);
    (n.connectedTo||[]).forEach(function(pid){
      var p = nodeById(pid);
      if (!p) return;
      if (n.id >= pid) return;
      var ppos = worldToScreenXY(p.x, p.y);
      var control = controlPointFor(n.id, pid);
      var handle = bezierHandleFor(control, p.x, p.y, n.x, n.y);
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', 'M ' + ppos.sx + ' ' + ppos.sy + ' Q ' + handle.x + ' ' + handle.y + ' ' + pos.sx + ' ' + pos.sy);
      path.setAttribute('class', 'edge-line' + (isConnectorHidden(n.id, pid) ? ' hidden-connector' : ''));
      layerEdges.appendChild(path);

      if (state.mode === 'select') {
        var isDragging = drag && drag.curve && curveKey(drag.curve.a, drag.curve.b) === curveKey(n.id, pid);
        var anchor = document.createElementNS(NS, 'circle');
        anchor.setAttribute('cx', control.x); anchor.setAttribute('cy', control.y);
        anchor.setAttribute('r', isDragging ? 7 : 5);
        anchor.setAttribute('class', 'curve-anchor' + (isDragging ? ' dragging' : ''));
        anchor.dataset.a = n.id; anchor.dataset.b = pid;
        layerEdges.appendChild(anchor);
      }
    });
  });

  state.nodes.forEach(function(n){
    var t = typeById(n.type);
    var tier = t ? tierOf(t) : 'SMALL';
    var r = radiusFor(tier);
    var pos = worldToScreenXY(n.x, n.y);
    var dim = matchIds && !matchIds[n.id];
    var isSelected = state.selectedIds.indexOf(n.id) !== -1;
    var isBad = !!badIds[n.id];
    var hasIcon = !isBad && t && t.icon;
    var color = isBad ? getComputedStyle(document.documentElement).getPropertyValue('--danger') : getComputedStyle(document.documentElement).getPropertyValue(colorVarFor(tier));
    color = color.trim();

    if (hasIcon) {
      var iconGroup = document.createElementNS(NS, 'g');
      iconGroup.setAttribute('transform', 'translate(' + pos.sx + ',' + pos.sy + ')');
      var img = document.createElementNS(NS, 'image');
      img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', t.icon);
      img.setAttribute('href', t.icon);
      img.setAttribute('x', -r); img.setAttribute('y', -r);
      img.setAttribute('width', r * 2); img.setAttribute('height', r * 2);
      img.setAttribute('clip-path', 'url(#' + NODE_ICON_CLIP_IDS[tier] + ')');
      img.setAttribute('opacity', dim ? 0.25 : 1);
      img.style.pointerEvents = 'none';
      iconGroup.appendChild(img);
      layerNodes.appendChild(iconGroup);
    }

    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', pos.sx); c.setAttribute('cy', pos.sy); c.setAttribute('r', r);
    c.setAttribute('class', 'node-circle');
    c.setAttribute('fill', color);
    c.setAttribute('fill-opacity', hasIcon ? 0 : (dim ? 0.25 : (isSelected ? 1 : 0.85)));
    c.setAttribute('stroke', isSelected ? getComputedStyle(document.documentElement).getPropertyValue('--text').trim() : (hasIcon ? color : 'rgba(0,0,0,.25)'));
    c.setAttribute('stroke-width', isSelected ? 2.5 : (hasIcon ? 2 : 1));
    c.setAttribute('stroke-opacity', hasIcon && dim ? 0.25 : 1);
    c.dataset.nodeId = n.id;
    layerNodes.appendChild(c);

    if (state.showLabels && !dim) {
      var lbl = document.createElementNS(NS, 'text');
      lbl.setAttribute('x', pos.sx);
      lbl.setAttribute('y', pos.sy + r + 12);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.setAttribute('class', 'node-label');
      lbl.textContent = t ? t.name : n.type;
      layerLabels.appendChild(lbl);
    }
  });

  if (drag && drag.marquee && drag.curClientX !== undefined) {
    var wrapRect = canvasWrap.getBoundingClientRect();
    var mx1 = drag.startClientX - wrapRect.left, my1 = drag.startClientY - wrapRect.top;
    var mx2 = drag.curClientX - wrapRect.left, my2 = drag.curClientY - wrapRect.top;
    var marqueeRect = document.createElementNS(NS, 'rect');
    marqueeRect.setAttribute('x', Math.min(mx1, mx2));
    marqueeRect.setAttribute('y', Math.min(my1, my2));
    marqueeRect.setAttribute('width', Math.abs(mx2 - mx1));
    marqueeRect.setAttribute('height', Math.abs(my2 - my1));
    marqueeRect.setAttribute('class', 'marquee-rect');
    svg.appendChild(marqueeRect);
  }

  attachNodeHandlers();
  attachCurveAnchorHandlers();
  attachOrbitAnchorHandlers();
  attachImageHandlers();
  attachStarHandlers();
  updateStats();
  updateWarnBadge();
}

function updateStats(){
  document.getElementById('statsLine').textContent =
    state.nodes.length + ' nodes - ' + state.types.length + ' types - zoom ' + state.view.zoom.toFixed(2) + 'x';
}
function updateWarnBadge(){
  var el = document.getElementById('warnBadge');
  var issues = validate();
  if (issues.length === 0) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.textContent = issues.length + ' issue' + (issues.length>1?'s':'') + ' - click to view';
  el.onclick = function(){ alert(issues.join('\n')); };
}

var drag = null;

function attachNodeHandlers(){
  var circles = layerNodes.querySelectorAll('circle');
  circles.forEach(function(c){
    c.addEventListener('pointerdown', function(ev){
      ev.stopPropagation();
      var id = c.dataset.nodeId;
      if (state.mode === 'add') return;

      if ((ev.ctrlKey || ev.metaKey) && state.selectedIds.length === 1 && state.selectedIds[0] !== id) {
        toggleLink(state.selectedIds[0], id);
        return;
      }

      if (ev.shiftKey) {
        toggleNodeSelection(id);
        return;
      }

      if (state.selectedIds.indexOf(id) === -1) {
        selectNode(id);
      }
      startGroupDrag(ev);
      ev.target.setPointerCapture(ev.pointerId);
    });
  });
}

function attachCurveAnchorHandlers(){
  var anchors = layerEdges.querySelectorAll('.curve-anchor');
  anchors.forEach(function(c){
    c.addEventListener('pointerdown', function(ev){
      ev.stopPropagation();
      drag = { curve: { a: c.dataset.a, b: c.dataset.b } };
      ev.target.setPointerCapture(ev.pointerId);
    });
  });
}

  layerAnchorHandles.querySelectorAll('.orbit-resize').forEach(function(c){

      drag = { anchorResize: c.dataset.anchorResizeId };
      ev.target.setPointerCapture(ev.pointerId);
    });
  });
  layerAnchorHandles.querySelectorAll('.orbit-shape-cycle').forEach(function(c){
    c.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); });
    c.addEventListener('click', function(ev){
      ev.stopPropagation();
      var a = anchorById(c.dataset.anchorShapeCycleId);
      if (!a) return;
      var idx = ANCHOR_SHAPES.indexOf(a.shape || 'circle');
      var nextShape = ANCHOR_SHAPES[(idx + 1) % ANCHOR_SHAPES.length];
      if (nextShape === 'circle') { delete a.shape; delete a.aspectRatio; delete a.rotation; }
      else {
        a.shape = nextShape;
        if (nextShape === 'rectangle') a.aspectRatio = ANCHOR_RECTANGLE_ASPECT;
        else delete a.aspectRatio;
      }
      resyncNodesOnAnchor(a);
      saveLocal();
      render();
      refreshInspector();
    });

  layerAnchorHandles.querySelectorAll('.orbit-rotate').forEach(function(c){
    c.addEventListener('pointerdown', function(ev){
      ev.stopPropagation();
      drag = { anchorRotate: c.dataset.anchorRotateId };

function startGroupDrag(ev){
  drag = {
    startWorld: screenPointToWorld(ev.clientX, ev.clientY),
    origPositions: state.selectedIds.map(function(id){
      var n = nodeById(id);
      return { id: id, x: n.x, y: n.y };
    }),
    origAnchorPositions: state.selectedAnchorIds.map(function(id){
      var a = anchorById(id);
      return { id: id, x: a.x, y: a.y };
    }),
    origImagePositions: state.selectedImageIds.map(function(id){
      var img = imageById(id);
      return { id: id, x: img.x, y: img.y };
    }),
    origStarPositions: state.selectedStarIds.map(function(id){
      var s = starById(id);
      return { id: id, x: s.x, y: s.y };
    }),
    origCurveControls: state.curves.filter(function(c){
      return state.selectedIds.indexOf(c.a) !== -1 || state.selectedIds.indexOf(c.b) !== -1;
    }).map(function(c){
      return { a: c.a, b: c.b, controlX: c.controlX, controlY: c.controlY };
    }),
    moved: false
  };
}

function shiftDraggedCurveControls(dx, dy){
  drag.origCurveControls.forEach(function(op){
    var c = findCurve(op.a, op.b);
    if (c) {
      c.controlX = Math.round(op.controlX + dx);
      c.controlY = Math.round(op.controlY + dy);
    }
  });
}

function isDragMovingId(origPositions, id){
  return !!(origPositions && origPositions.some(function(op){ return op.id === id; }));
}

canvasWrap.addEventListener('pointerdown', function(ev){
  if (ev.target !== svg && ev.target.tagName !== 'svg') return;
  if (state.mode === 'add') {
    var w = screenPointToWorld(ev.clientX, ev.clientY);
    openAddNodeModal(Math.round(w.x), Math.round(w.y));
    return;
  }
  if (state.mode === 'addAnchor') {
    var wa = screenPointToWorld(ev.clientX, ev.clientY);
    var newAnchor = { id: uniqueAnchorId(), x: Math.round(wa.x), y: Math.round(wa.y), radius: 150 };
    if (state.pendingAnchorShape && state.pendingAnchorShape !== 'circle') {
      newAnchor.shape = state.pendingAnchorShape;
      if (state.pendingAnchorShape === 'rectangle') newAnchor.aspectRatio = ANCHOR_RECTANGLE_ASPECT;
    }
    state.anchors.push(newAnchor);
    clearAllSelection();
    state.selectedAnchorIds = [newAnchor.id];
    document.getElementById('inspector').classList.add('open');
    saveLocal();
    setMode('select');
    refreshInspector();
    return;
  }
  if (state.mode === 'addImage') {
    var wi0 = screenPointToWorld(ev.clientX, ev.clientY);
    var newImage = {
      id: uniqueImageId(), x: Math.round(wi0.x), y: Math.round(wi0.y),
      width: 800, height: 800,
      imagePath: state.availableImages.length ? state.availableImages[0] : null
    };
    state.images.push(newImage);
    clearAllSelection();
    state.selectedImageIds = [newImage.id];
    document.getElementById('inspector').classList.add('open');
    saveLocal();
    setMode('select');
    refreshInspector();
    return;
  }
  if (state.mode === 'addStar') {
    var ws0 = screenPointToWorld(ev.clientX, ev.clientY);
    var newStar = {
      id: uniqueStarId(), x: Math.round(ws0.x), y: Math.round(ws0.y),
      radius: 850, starType: 'star_yellow', color: null
    };
    state.stars.push(newStar);
    clearAllSelection();
    state.selectedStarIds = [newStar.id];
    document.getElementById('inspector').classList.add('open');
    saveLocal();
    setMode('select');
    refreshInspector();
    return;
  }
  if (ev.shiftKey) {
    drag = { marquee: true, startClientX: ev.clientX, startClientY: ev.clientY };
    return;
  }
  if (anySelected()) {
    clearAllSelection();
    document.getElementById('inspector').classList.remove('open');
    refreshInspector();
    render();
  }
  drag = { pan: true, startClientX: ev.clientX, startClientY: ev.clientY, startPanX: state.view.panX, startPanY: state.view.panY };
});

window.addEventListener('pointermove', function(ev){
  if (!drag) return;
  if (drag.marquee) {
    drag.curClientX = ev.clientX;
    drag.curClientY = ev.clientY;
    render();
    return;
  }
  if (drag.pan) {
    state.view.panX = drag.startPanX + (ev.clientX - drag.startClientX);
    state.view.panY = drag.startPanY + (ev.clientY - drag.startClientY);
    render();
    return;
  }
  if (drag.curve) {
    var wc = screenPointToWorld(ev.clientX, ev.clientY);
    setCurveControl(drag.curve.a, drag.curve.b, Math.round(wc.x), Math.round(wc.y));
    render();
    return;
  }
  if (drag.anchorResize) {
    var rAnchor = anchorById(drag.anchorResize);
    if (rAnchor) {
      var wr = screenPointToWorld(ev.clientX, ev.clientY);
      var rdx = wr.x - rAnchor.x, rdy = wr.y - rAnchor.y;
      rAnchor.radius = Math.max(10, Math.round(Math.sqrt(rdx*rdx + rdy*rdy)));
      resyncNodesOnAnchor(rAnchor);
    }
    render();
    if (state.selectedAnchorIds.length === 1) refreshInspector();
    return;
  }
  if (drag.anchorRotate) {
    var gAnchor = anchorById(drag.anchorRotate);
    if (gAnchor) {
      var wg = screenPointToWorld(ev.clientX, ev.clientY);
      var angleDeg = Math.atan2(wg.y - gAnchor.y, wg.x - gAnchor.x) * 180 / Math.PI;
      var rotation = angleDeg + 90;
      rotation = snapAngleToTargets(rotation, ORBIT_CARDINAL_ANGLES);
      gAnchor.rotation = Math.round((((rotation % 360) + 360) % 360) * 10) / 10;
      resyncNodesOnAnchor(gAnchor);
    }
    render();
    if (state.selectedAnchorIds.length === 1) refreshInspector();
    return;
  }
  if (drag.imageResize) {
    var rImg = imageById(drag.imageResize);
    if (rImg) {
      var wir = screenPointToWorld(ev.clientX, ev.clientY);
      var rdx = wir.x - rImg.x, rdy = wir.y - rImg.y;
      var rLocal = (rImg.rotation) ? rotateAroundOrigin(rdx, rdy, -rImg.rotation) : { x: rdx, y: rdy };
      rImg.width = Math.max(20, Math.round(Math.abs(rLocal.x) * 2));
      rImg.height = Math.max(20, Math.round(Math.abs(rLocal.y) * 2));
    }
    render();
    if (state.selectedImageIds.length === 1) refreshInspector();
    return;
  }
  if (drag.imageRotate) {
    var rotImg = imageById(drag.imageRotate);
    if (rotImg) {
      var wrot = screenPointToWorld(ev.clientX, ev.clientY);
      var angleDeg = Math.atan2(wrot.y - rotImg.y, wrot.x - rotImg.x) * 180 / Math.PI;
      var rotation = angleDeg + 90;
      rotImg.rotation = Math.round(((rotation % 360) + 360) % 360);
    }
    render();
    if (state.selectedImageIds.length === 1) refreshInspector();
    return;
  }
  if (drag.starResize) {
    var rStar = starById(drag.starResize);
    if (rStar) {
      var wsr = screenPointToWorld(ev.clientX, ev.clientY);
      var sdx = wsr.x - rStar.x, sdy = wsr.y - rStar.y;
      rStar.radius = Math.max(20, Math.round(Math.sqrt(sdx*sdx + sdy*sdy)));
    }
    render();
    if (state.selectedStarIds.length === 1) refreshInspector();
    return;
  }
  var w = screenPointToWorld(ev.clientX, ev.clientY);
  var dx = w.x - drag.startWorld.x, dy = w.y - drag.startWorld.y;
  if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) drag.moved = true;
  var soleSelectionIsOneNode = drag.origPositions.length === 1
    && drag.origAnchorPositions.length === 0
    && drag.origImagePositions.length === 0
    && drag.origStarPositions.length === 0;
  var singleNode = soleSelectionIsOneNode ? nodeById(drag.origPositions[0].id) : null;
  if (singleNode) {
    var op0 = drag.origPositions[0];
    var tentativeX = op0.x + dx, tentativeY = op0.y + dy;
    var bestAnchor = null, bestDelta = Infinity;
    state.anchors.forEach(function(a){
      var adx = tentativeX - a.x, ady = tentativeY - a.y;
      var dist = Math.sqrt(adx*adx + ady*ady);
      var angleDeg = Math.atan2(ady, adx) * 180 / Math.PI;
      var boundaryPt = positionOnAnchor(a, angleDeg);
      var localRadius = Math.sqrt(Math.pow(boundaryPt.x - a.x, 2) + Math.pow(boundaryPt.y - a.y, 2));
      var delta = Math.abs(dist - localRadius);
      var threshold = singleNode.orbitAnchorId === a.id ? ORBIT_DETACH_RADIUS : ORBIT_SNAP_RADIUS;
      if (delta <= threshold && delta < bestDelta) { bestDelta = delta; bestAnchor = a; }
    });
    if (bestAnchor) {
      snapNodeToAnchor(singleNode, bestAnchor, tentativeX, tentativeY);
    } else {
      if (singleNode.orbitAnchorId) detachNodeFromAnchor(singleNode);
      var aligned = computeAlignmentSnap(singleNode, tentativeX, tentativeY);
      singleNode.x = Math.round(aligned ? aligned.x : tentativeX);
      singleNode.y = Math.round(aligned ? aligned.y : tentativeY);
    }
  } else {
    drag.origPositions.forEach(function(op){
      var n = nodeById(op.id);
      if (n) {
        n.x = Math.round(op.x + dx);
        n.y = Math.round(op.y + dy);
      }
    });
    drag.origAnchorPositions.forEach(function(op){
      var a = anchorById(op.id);
      if (a) {
        a.x = Math.round(op.x + dx);
        a.y = Math.round(op.y + dy);
        resyncNodesOnAnchor(a);
      }
    });
    drag.origImagePositions.forEach(function(op){
      var img = imageById(op.id);
      if (img) {
        img.x = Math.round(op.x + dx);
        img.y = Math.round(op.y + dy);
      }
    });
    drag.origStarPositions.forEach(function(op){
      var s = starById(op.id);
      if (s) {
        s.x = Math.round(op.x + dx);
        s.y = Math.round(op.y + dy);
      }
    });
  }
  shiftDraggedCurveControls(dx, dy);
  render();
  if (state.selectedIds.length === 1) refreshInspector();
  if (state.selectedAnchorIds.length === 1) refreshInspector();
  if (state.selectedImageIds.length === 1) refreshInspector();
  if (state.selectedStarIds.length === 1) refreshInspector();
});

window.addEventListener('pointerup', function(ev){
  if (drag && drag.marquee) {
    finishMarqueeSelect(ev);
  } else if (drag && drag.curve) {
    snapCurveToStraightIfClose(drag.curve.a, drag.curve.b);
    saveLocal();
  } else if (drag && (drag.anchorResize || drag.anchorRotate)) {
    saveLocal();
  } else if (drag && (drag.imageResize || drag.imageRotate)) {
    saveLocal();
  } else if (drag && drag.starResize) {
    saveLocal();
  } else if (drag && !drag.pan && drag.moved) {
    saveLocal();
  }
  drag = null;
  render();
});

function finishMarqueeSelect(ev){
  var w1 = screenPointToWorld(drag.startClientX, drag.startClientY);
  var w2 = screenPointToWorld(ev.clientX, ev.clientY);
  var minX = Math.min(w1.x, w2.x), maxX = Math.max(w1.x, w2.x);
  var minY = Math.min(w1.y, w2.y), maxY = Math.max(w1.y, w2.y);
  var inRect = function(x, y){ return x >= minX && x <= maxX && y >= minY && y <= maxY; };
  state.selectedIds = state.nodes.filter(function(n){
    return inRect(n.x, n.y);
  }).map(function(n){ return n.id; });
  state.selectedAnchorIds = state.anchors.filter(function(a){
    return inRect(a.x, a.y);
  }).map(function(a){ return a.id; });
  state.selectedImageIds = state.images.filter(function(img){
    return inRect(img.x, img.y);
  }).map(function(img){ return img.id; });
  state.selectedStarIds = state.stars.filter(function(s){
    return inRect(s.x, s.y);
  }).map(function(s){ return s.id; });
  document.getElementById('inspector').classList.toggle('open', anySelected());
  refreshInspector();
}

function selectionCount(){
  return state.selectedIds.length + state.selectedAnchorIds.length + state.selectedImageIds.length + state.selectedStarIds.length;
}
function anySelected(){
  return selectionCount() > 0;
}
function clearAllSelection(){
  state.selectedIds = [];
  state.selectedAnchorIds = [];
  state.selectedImageIds = [];
  state.selectedStarIds = [];
}
function afterSelectionToggle(){
  document.getElementById('inspector').classList.toggle('open', anySelected());
  render();
  refreshInspector();
}
function toggleNodeSelection(id){
  var idx = state.selectedIds.indexOf(id);

  else state.selectedIds.splice(idx, 1);

}
function toggleAnchorSelection(id){

canvasWrap.addEventListener('wheel', function(ev){
  ev.preventDefault();
  var factor = ev.deltaY < 0 ? 1.1 : 0.9;
  var rect = canvasWrap.getBoundingClientRect();
  var mx = ev.clientX - rect.left - rect.width/2 - state.view.panX;
  var my = ev.clientY - rect.top - rect.height/2 - state.view.panY;
  var newZoom = Math.min(3, Math.max(0.08, state.view.zoom * factor));
  var scaleChange = newZoom / state.view.zoom;
  state.view.panX -= mx * (scaleChange - 1);
  state.view.panY -= my * (scaleChange - 1);
  state.view.zoom = newZoom;
  render();
}, { passive: false });

function toggleLink(aId, bId){
  var a = nodeById(aId), b = nodeById(bId);
  if (!a || !b) return;
  var idx = a.connectedTo.indexOf(b.id);
  if (idx === -1) {
    a.connectedTo.push(b.id);
    b.connectedTo.push(a.id);
    if (a.orbitAnchorId && a.orbitAnchorId === b.orbitAnchorId) {
      var sharedAnchor = anchorById(a.orbitAnchorId);
      if (sharedAnchor) syncRingArcCurves(sharedAnchor);
    }
    showToast(a.id + ' <-> ' + b.id + ' connected');
  } else {
    a.connectedTo.splice(idx, 1);
    var backIdx = b.connectedTo.indexOf(a.id);
    if (backIdx !== -1) b.connectedTo.splice(backIdx, 1);
    removeCurve(a.id, b.id);
    showToast('Unlinked ' + a.id + ' from ' + b.id);
  }
  saveLocal();
  render();
}

  if (btn) btn.classList.add('active');

    btn.classList.add('active');

document.addEventListener('keydown', function(ev){
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'SELECT') return;
  if (!ev.ctrlKey && !ev.metaKey) {
    var map = { 'a': 'select', 's': 'add', 'd': 'addAnchor', 'f': 'addImage', 'g': 'addStar' };
    var m = map[ev.key.toLowerCase()];
    if (m) { document.querySelector('.modeBtn[data-mode="'+m+'"]').click(); }
    if (ev.key === 'q' || ev.key === 'Q') { deleteSelectionOrAnchor(); }
  }
  if (ev.key === 'Delete' || ev.key === 'Backspace') { deleteSelectionOrAnchor(); }
  if ((ev.key === 'd' || ev.key === 'D') && (ev.ctrlKey || ev.metaKey)) {
    ev.preventDefault();
    if (state.selectedIds.length === 1) { duplicateNode(nodeById(state.selectedIds[0])); }
  }
  if (ev.key === 'Escape' && anySelected()) {
    clearAllSelection();
    document.getElementById('inspector').classList.remove('open');
    render();
    refreshInspector();
  }
});

function deleteSelectionOrAnchor(){
  if (!anySelected()) return;
  if (state.selectedIds.length > 0) deleteSelectedNodes();
  if (state.selectedAnchorIds.length > 0 || state.selectedImageIds.length > 0 || state.selectedStarIds.length > 0) {
    state.selectedAnchorIds.forEach(deleteAnchor);
    var imgIds = state.selectedImageIds;
    if (imgIds.length) state.images = state.images.filter(function(img){ return imgIds.indexOf(img.id) === -1; });
    var starIds = state.selectedStarIds;
    if (starIds.length) state.stars = state.stars.filter(function(s){ return starIds.indexOf(s.id) === -1; });
    state.selectedAnchorIds = [];
    state.selectedImageIds = [];
    state.selectedStarIds = [];
    document.getElementById('inspector').classList.remove('open');
    saveLocal();
    render();
    refreshInspector();
  }
}

  var body = document.getElementById('inspectorBody');

    return;

  if (total > 1) {
    refreshMultiInspector(body);

  }
  if (state.selectedAnchorIds.length === 1) {
    refreshAnchorInspector(body);
    return;
  }
  if (state.selectedImageIds.length === 1) {

  }

    '</div>';

  var otherNodeOptions = state.nodes.filter(function(o){ return o.id !== n.id; }).map(function(o){
    return '<option value="' + o.id + '">' + o.id + '</option>';

  var statsHtml = '';

        '<textarea id="inspDescription" rows="3" style="width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--text);font-family:var(--font-mono);font-size:12.5px;padding:7px 9px;resize:vertical;">' + (t.description||'') + '</textarea>' +
      '</div>' +
      '<div class="field"><label>Stats granted by type "' + t.id + '"</label>' + statRows + '</div>' +
      '<div class="btnRow"><button class="smallBtn" id="addStatRowBtn">+ Add effect</button></div>' +
      '<div class="field"><label>Hull-size-dependent stats</label>' + renderHullSizeEffectRows('insp', t.hullSizeEffects) + '</div>' +
      '<div class="btnRow"><button class="smallBtn" id="addHsStatRowBtn">+ Add hull-size effect</button></div>' +
      '<div class="field"><label>Item cost</label><div class="fieldRow">' +
        '<input id="inspItemCostId" placeholder="commodity id, e.g. lobster" value="' + ((t.itemCost && t.itemCost.itemId) || '') + '" style="flex:2">' +
        '<input id="inspItemCostQuantity" type="number" placeholder="quantity" value="' + ((t.itemCost && t.itemCost.quantity) || '') + '" style="flex:1">' +
      '</div></div>' +
      '<div class="field"><label>Temporary after deployment (seconds)</label><input id="inspTemporaryAfterDeploymentSeconds" type="number" min="0" placeholder="leave blank for always-on" value="' + (t.temporaryAfterDeploymentSeconds || '') + '"></div>' +
      '<hr class="sep">';
  }

  body.innerHTML =
    '<h2>' + (t ? t.name : n.type) + '</h2>' +

    (t ? '<div class="field"><label>Type tags (shared by every "' + t.id + '" node)</label>' + renderTagChips('insp', t.tags || [], TYPE_TAG_GROUPS) + '</div>' : '') +

    '<div class="fieldRow">' +
      '<div class="field"><label>X</label><input type="number" value="' + n.x + '" data-field="x"></div>' +
      '<div class="field"><label>Y</label><input type="number" value="' + n.y + '" data-field="y"></div>' +
    '</div>' +
    (tier === 'KEYSTONE' ?
      '<div class="field"><label>Ring belt art (optional)</label><div class="fieldRow">' +
        '<input value="' + (n.ringBeltPath || '') + '" placeholder="graphics/planets/ring_band_asteroids.png" data-field="ringBeltPath" style="flex:1">' +
        '<button class="smallBtn" type="button" id="selectRingBeltBtn">Select Image</button>' +
      '</div></div>' +
      (isAuroraBelt(n) ?
        '<div class="field"><label>Aurora colour</label><input type="color" value="' + (n.ringBeltColor || '#8c78ff') + '" data-field="ringBeltColor"></div>'
      : '') +
      '<div class="field"><label>Ring belt width (? node size, default ' + KEYSTONE_BELT_DEFAULT_WIDTH + ')</label><input type="number" step="0.1" min="0.1" value="' + (n.ringBeltWidth || '') + '" placeholder="' + KEYSTONE_BELT_DEFAULT_WIDTH + '" data-field="ringBeltWidth"></div>'
    : '') +

    '</div>' +
    '<button class="smallBtn danger" id="deleteNodeBtn">Delete this node <span class="key">Q</span></button>';

  body.querySelectorAll('[data-field]').forEach(function(inp){
    inp.addEventListener('change', function(){
      var field = inp.dataset.field;
      if (field === 'id') {
        var newId = inp.value.trim();
        if (!newId || nodeById(newId)) { showToast('Id must be unique and non-empty'); inp.value = n.id; return; }
        var oldId = n.id;
        n.id = newId;
        state.nodes.forEach(function(o){
          var idx = o.connectedTo.indexOf(oldId);
          if (idx !== -1) o.connectedTo[idx] = newId;
        });
        state.selectedIds = [newId];
      } else if (field === 'type') {
        n.type = inp.value;
      } else if (field === 'x' || field === 'y') {
        n[field] = parseInt(inp.value, 10) || 0;
      } else if (field === 'ringBeltPath') {
        var val = inp.value.trim();
        if (val) n.ringBeltPath = val; else delete n.ringBeltPath;
      } else if (field === 'ringBeltColor') {
        n.ringBeltColor = inp.value;
      } else if (field === 'ringBeltWidth') {
        var width = parseFloat(inp.value);
        if (!isNaN(width) && width > 0) n.ringBeltWidth = width; else delete n.ringBeltWidth;
      } else if (field === 'wormholeColor') {
        n.wormholeColor = inp.value;
      } else if (field === 'pairedWith') {
        var oldPairedId = n.pairedWith;
        var oldPaired = oldPairedId ? nodeById(oldPairedId) : null;
        if (oldPaired && oldPaired.pairedWith === n.id) delete oldPaired.pairedWith;

        var newPairedId = inp.value;
        if (newPairedId) {
          n.pairedWith = newPairedId;
          var newPaired = nodeById(newPairedId);
          if (newPaired) {
            var priorPartner = newPaired.pairedWith ? nodeById(newPaired.pairedWith) : null;
            if (priorPartner && priorPartner.id !== n.id && priorPartner.pairedWith === newPaired.id) delete priorPartner.pairedWith;

    body.querySelectorAll('[id^="inspEffect"], [id^="inspMag"]').forEach(function(el){

    };

    inspItemCostQuantity.addEventListener('change', function(){ syncInspItemCost(); refreshInspector(); });
    var inspTemporaryAfterDeploymentSeconds = document.getElementById('inspTemporaryAfterDeploymentSeconds');

function duplicateNode(n){
  var copy = deepCopy(n);
  copy.id = uniqueNodeId(n.type);
  copy.x = n.x + 40; copy.y = n.y - 40;
  copy.connectedTo = [n.id];
  detachNodeFromAnchor(copy);
  n.connectedTo.push(copy.id);
  state.nodes.push(copy);
  selectNode(copy.id);
  saveLocal();
}

function uniqueNodeId(typeId){
  var i = 1, id;
  do { id = typeId + '_' + i; i++; } while (nodeById(id));
  return id;
}

function deleteSelectedNodes(){
  var ids = state.selectedIds;
  if (ids.length === 0) return;
  state.nodes = state.nodes.filter(function(o){ return ids.indexOf(o.id) === -1; });
  state.nodes.forEach(function(o){
    o.connectedTo = o.connectedTo.filter(function(pid){ return ids.indexOf(pid) === -1; });
  });
  ids.forEach(removeCurvesForNode);
  ids.forEach(removeHiddenConnectorsForNode);
  state.selectedIds = [];
  document.getElementById('inspector').classList.remove('open');
  saveLocal();
  render();
  refreshInspector();
}

function refreshAnchorInspector(body){
  var a = anchorById(state.selectedAnchorIds[0]);
  if (!a) {

  var shape = a.shape || 'circle';

    return '<option value="' + s + '"' + (s === shape ? ' selected' : '') + '>' + (ANCHOR_SHAPE_LABELS[s] || s) + '</option>';
  }).join('');
  var isAsteroidBelt = shape === 'asteroidBelt';
  var beltStyleVal = a.beltStyle || 'asteroids';
  var beltBandWidthVal = a.beltBandWidth || Math.max(60, Math.round(a.radius * 0.2));
  var beltStyleOptions = RING_BELT_STYLES.map(function(s){
    return '<option value="' + s.id + '"' + (s.id === beltStyleVal ? ' selected' : '') + '>' + s.label + '</option>';
  }).join('');
  body.innerHTML =
    '<h2>Anchor</h2>' +
    '<div class="field"><label>Anchor id</label><input value="' + a.id + '" data-anchor-field="id"></div>' +
    '<div class="fieldRow">' +
      '<div class="field"><label>X</label><input type="number" value="' + a.x + '" data-anchor-field="x"></div>' +
      '<div class="field"><label>Y</label><input type="number" value="' + a.y + '" data-anchor-field="y"></div>' +
    '</div>' +
    '<div class="fieldRow">' +
      '<div class="field"><label>Radius</label><input type="number" value="' + a.radius + '" data-anchor-field="radius"></div>' +
      '<div class="field"><label>Shape</label><select data-anchor-field="shape">' + shapeOptions + '</select></div>' +
    '</div>' +
    (shape === 'rectangle' ? '<div class="field"><label>Aspect ratio (width/height)</label><input type="number" step="0.1" min="0.1" value="' + (a.aspectRatio || ANCHOR_RECTANGLE_ASPECT) + '" data-anchor-field="aspectRatio"></div>' : '') +
    (shape !== 'circle' && !isAsteroidBelt ? '<div class="field"><label>Rotation (degrees)</label><input type="number" step="1" value="' + (a.rotation || 0) + '" data-anchor-field="rotation"></div>' : '') +
    (isAsteroidBelt ?
      '<hr class="sep">' +
      '<div class="fieldRow">' +
        '<div class="field"><label>Band width</label><input type="number" min="10" value="' + beltBandWidthVal + '" data-anchor-field="beltBandWidth"></div>' +

        if (!newId || anchorById(newId)) { showToast('Id must be unique and non-empty'); inp.value = a.id; return; }

function nearestRegionTag(x, y){
  var best = REGION_TAGS[0], bestDistance = Infinity;
  state.nodes.forEach(function(o){
    var regions = (o.tags || []).filter(isRegionTag);
    if (regions.length !== 1) return;
    var distance = (o.x - x) * (o.x - x) + (o.y - y) * (o.y - y);
    if (distance < bestDistance) { bestDistance = distance; best = regions[0]; }
  });
  return best;
}
function addNodeOfType(typeId, x, y){
  var node = { id: uniqueNodeId(typeId), type: typeId, connectedTo: [], x: x, y: y, tags: [nearestRegionTag(x, y)] };
  state.nodes.push(node);
  saveLocal();
  setMode('select');
  selectNode(node.id);
}

  { key: 'theme', label: 'Theme' },

];

function isRegionTag(tag){ return REGION_TAGS.indexOf(tag) !== -1; }
function tagGroupOf(tag){
  if (isRegionTag(tag)) return 'region';
  if (tag.indexOf('req_') === 0 || tag === 'campaign_only' || tag === 'player_only') return 'requirement';
  return 'theme';
}

function renderTagChip(idPrefix, tag, isActive, isInvalid){
  return '<span class="tagChip' + (isActive ? ' active' : '') + (isInvalid ? ' invalid' : '') + '" data-' + idPrefix + '-toggle-tag="' + tag + '">' + tag + '</span>';
}

function renderTagChips(idPrefix, activeTags, groupKeys){
  var rows = [];
  TAG_GROUPS.forEach(function(g){
    var inScope = !groupKeys || groupKeys.indexOf(g.key) !== -1;
    var groupTags = ALL_TAGS.filter(function(tag){ return tagGroupOf(tag) === g.key; });
    if (!inScope) groupTags = groupTags.filter(function(tag){ return activeTags.indexOf(tag) !== -1; });
    if (!groupTags.length) return;
    rows.push('<div class="tagGroupLabel">' + g.label + (inScope ? '' : ' (not expected here - click to remove)') + '</div>' +
      '<div class="tagChipRow">' + groupTags.map(function(tag){
        return renderTagChip(idPrefix, tag, activeTags.indexOf(tag) !== -1, !inScope);
      }).join('') + '</div>');
  });
  var unknownTags = activeTags.filter(function(tag){ return ALL_TAGS.indexOf(tag) === -1; });
  if (unknownTags.length) {
    rows.push('<div class="tagGroupLabel">Unknown (click to remove)</div>' +
      '<div class="tagChipRow">' + unknownTags.map(function(tag){
        return renderTagChip(idPrefix, tag, true, true);
      }).join('') + '</div>');
  }
  return rows.join('');
}

function renderOptionalOptionsSelect(selectedIds, selfId){
  var candidates = state.types.filter(function(ty){ return ty.id !== selfId; });

  }
  var opts = candidates.map(function(ty){
    var sel = selectedIds.indexOf(ty.id) !== -1 ? ' selected' : '';
    return '<option value="' + ty.id + '"' + sel + '>' + (ty.name || ty.id) + '</option>';
  }).join('');
  return '<select id="tOptionalOptions" multiple size="6">' + opts + '</select>';
}

function syncUnlockConditionRowsFromInputs(idPrefix, conditionsDraft){
  conditionsDraft.forEach(function(c, i){
    var typeSel = document.getElementById(idPrefix + 'UnlockType' + i);

    c.type = typeSel.value;
    if (c.type === 'characterStat') {
