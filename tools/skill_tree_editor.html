      if (statInp) c.statId = statInp.value.trim();
    } else if (c.type === 'minShipLevel') {
      var levelInp = document.getElementById(idPrefix + 'UnlockLevel' + i);
      if (levelInp) c.level = parseInt(levelInp.value, 10) || 1;
    } else if (c.type === 'memoryFlag') {
      var keyInp = document.getElementById(idPrefix + 'UnlockKey' + i);
      if (keyInp) c.key = keyInp.value.trim();
    } else {
      var catSel = document.getElementById(idPrefix + 'UnlockCategory' + i);
      var idInp = document.getElementById(idPrefix + 'UnlockId' + i);
      if (catSel) c.category = catSel.value;
      if (idInp) c.id = idInp.value.trim();
    }
  });

function serializeUnlockConditions(conditionsDraft){
  if (!conditionsDraft) return [];
  var out = [];
  conditionsDraft.forEach(function(c){
    if (c.type === 'characterStat' && c.statId) {
      out.push({ type: 'characterStat', statId: c.statId });
    } else if (c.type === 'minShipLevel' && c.level) {
      out.push({ type: 'minShipLevel', level: c.level });
    } else if (c.type === 'memoryFlag' && c.key) {
      out.push({ type: 'memoryFlag', key: c.key });
    } else if (c.type === 'blueprint' && c.id) {
      out.push({ type: 'blueprint', category: c.category || 'hullmod', id: c.id });
    }
  });
  return out;
}

function imageBaseName(path){
  var name = path.split('/').pop();
  var dot = name.lastIndexOf('.');
  return dot === -1 ? name : name.substring(0, dot);
}

function imageFolder(path){
  var idx = path.lastIndexOf('/');
  return idx === -1 ? '' : path.substring(0, idx);
}

function buildFolderOptionsHtml(paths, selectedFolder){
  var counts = {};
  paths.forEach(function(p){
    var folder = imageFolder(p);
    counts[folder] = (counts[folder] || 0) + 1;
  });
  var folders = Object.keys(counts).sort();
  var html = '<option value=""' + (selectedFolder ? '' : ' selected') + '>All folders (' + paths.length + ')</option>';
  html += folders.map(function(f){
    var label = (f || '(root)') + ' (' + counts[f] + ')';
    return '<option value="' + f + '"' + (f === selectedFolder ? ' selected' : '') + '>' + label + '</option>';
  }).join('');
  return html;
}

function postImageOp(url, payload, onSuccess){
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(r){
    return r.json().then(function(data){ return { httpOk: r.ok, data: data }; });
  }).then(function(result){
    if (!result.httpOk || !result.data.ok) {
      showToast('Could not complete: ' + (result.data && result.data.message ? result.data.message : 'unknown error'));
      return;
    }
    onSuccess(result.data);
  }).catch(function(){
    showToast('Could not reach local server - run tools\\skill_tree_server.ps1');
  });
}

function moveIconIfNeeded(newPath){
  if (newPath && newPath.indexOf('graphics/unused/') === 0) {
    var finalPath = 'graphics/icons/' + newPath.split('/').pop();
    postImageOp('/move-image', { from: newPath, to: finalPath }, function(){
      fetchAllProjectImages();
    });
    return finalPath;
  }
  return newPath;
}

      '<h3>Change node type</h3>' +

    document.getElementById('typePickerFilter').addEventListener('input', updateList);
    updateList();
  }

  function updateList(){
    var q = (document.getElementById('typePickerFilter').value || '').toLowerCase();
    var filtered = state.types.filter(function(t){
      if (!q) return true;

    });

      return '<div class="' + cls + '" data-type-id="' + t.id + '">' +
        iconHtml +

    var q = (document.getElementById('imgEditFilter').value || '').toLowerCase();

    });

      var deg = parseFloat(hueInp.value) || 0;
      previewImg.style.filter = 'hue-rotate(' + deg + 'deg)';
    }
    hueInp.addEventListener('input', updatePreviewFilter);
    updatePreviewFilter();

    document.getElementById('imgEditCreate').addEventListener('click', function(){
      var suffix = document.getElementById('imgEditSuffix').value.trim();
      var hueShift = parseFloat(document.getElementById('imgEditHue').value) || 0;
      if (!suffix) { showToast('Suffix is required'); return; }
      postImageOp('/colorshift', { path: selectedPath, hueShift: hueShift, suffix: suffix }, function(data){
        showToast('Saved ' + data.path);
        selectedPath = data.path;
        fetchAllProjectImages(function(){ refreshFolderOptions(); updateGrid(); updateDetail(); });
      });
    });

    document.getElementById('imgEditCircular').addEventListener('click', function(){
      var suffix = document.getElementById('imgEditSuffix').value.trim();

        fetchAllProjectImages(function(){ refreshFolderOptions(); updateGrid(); updateDetail(); });

        selectedPath = null;
        fetchAllProjectImages(function(){ refreshFolderOptions(); updateGrid(); updateDetail(); });

    });
  }

  if (state.allProjectImages.length) buildShell();
  else fetchAllProjectImages(buildShell);

var toastTimer = null;
function showToast(msg){
  var el = document.getElementById('toast');

  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);

function renderRequiredHullSizeChecks(selected){
  return [['FRIGATE', 'Frigate'], ['DESTROYER', 'Destroyer'], ['CRUISER', 'Cruiser'], ['CAPITAL_SHIP', 'Capital']].map(function(size){
    return '<label><input type="checkbox" class="tRequiredHullSize" value="' + size[0] + '"' + (selected.indexOf(size[0]) >= 0 ? ' checked' : '') + '> ' + size[1] + '</label>';
  }).join('');
}
function serializeType(t){
  var out = { id: t.id, name: t.name, icon: t.icon };
  if (tierOf(t) !== 'SMALL') out.tier = tierOf(t);
  if (t.effects && t.effects.length) out.effects = t.effects.map(function(e){ return { effect: e.effect, magnitude: e.magnitude }; });
  if (t.hullSizeEffects && t.hullSizeEffects.length) out.hullSizeEffects = t.hullSizeEffects.map(function(e){ return { effect: e.effect, frigate: e.frigate, destroyer: e.destroyer, cruiser: e.cruiser, capitalShip: e.capitalShip }; });
  if (t.vanillaHullMod) out.vanillaHullMod = t.vanillaHullMod;
  if (t.itemCost && t.itemCost.itemId) out.itemCost = { itemId: t.itemCost.itemId, quantity: t.itemCost.quantity || 0 };
  if (t.temporaryAfterDeploymentSeconds) out.temporaryAfterDeploymentSeconds = t.temporaryAfterDeploymentSeconds;
  if (t.requiredHullSizes && t.requiredHullSizes.length) out.requiredHullSizes = t.requiredHullSizes;
  var unlockConditionsOut = serializeUnlockConditions(t.unlockConditions);
  if (unlockConditionsOut.length) out.unlockConditions = unlockConditionsOut;
  if (t.exclusiveHullMods && t.exclusiveHullMods.length) out.exclusiveHullMods = t.exclusiveHullMods;
  if (t.installedHullMods && t.installedHullMods.length) out.installedHullMods = t.installedHullMods;
  if (t.exclusiveSkillTypes && t.exclusiveSkillTypes.length) out.exclusiveSkillTypes = t.exclusiveSkillTypes;
  if (t.optionalOptions && t.optionalOptions.length) out.optionalOptions = t.optionalOptions;
  if (t.description) out.description = t.description;
  if (t.todo) out.todo = t.todo;
  if (t.tags && t.tags.length) out.tags = t.tags;
  return out;
}
function toTabbedJson(obj, rootKey){
  var wrapper = {}; wrapper[rootKey] = obj;
  return JSON.stringify(wrapper, null, '\t');
}
function buildTreeExportObject(){
  var nodesOut = state.nodes.map(function(n){
    var out = { id: n.id, type: n.type, connectedTo: n.connectedTo, x: n.x, y: n.y };
    if (n.orbitAnchorId) { out.orbitAnchorId = n.orbitAnchorId; out.orbitAngle = n.orbitAngle; }
    if (n.ringBeltPath) out.ringBeltPath = n.ringBeltPath;
    if (n.ringBeltColor) out.ringBeltColor = n.ringBeltColor;
    if (n.ringBeltWidth) out.ringBeltWidth = n.ringBeltWidth;
    if (n.wormholeColor) out.wormholeColor = n.wormholeColor;
    if (n.pairedWith) out.pairedWith = n.pairedWith;
    if (n.tags && n.tags.length) out.tags = n.tags;
    return out;
  });
  var out = { nodes: nodesOut };
  if (state.curves.length) {
    out.connectorCurves = state.curves.map(function(c){ return { a: c.a, b: c.b, controlX: c.controlX, controlY: c.controlY }; });
  }
  if (state.hiddenConnectors.length) {
    out.hiddenConnectors = state.hiddenConnectors.map(function(h){ return { a: h.a, b: h.b }; });
  }
  if (state.anchors.length) {
    out.orbitAnchors = state.anchors.map(function(a){
      var ao = { id: a.id, x: a.x, y: a.y, radius: a.radius };
      if (a.shape && a.shape !== 'circle') {
        ao.shape = a.shape;
        if (a.shape === 'rectangle') ao.aspectRatio = a.aspectRatio || ANCHOR_RECTANGLE_ASPECT;
        if (a.rotation) ao.rotation = a.rotation;
        if (a.shape === 'asteroidBelt') {
          if (a.beltBandWidth) ao.beltBandWidth = a.beltBandWidth;
          if (a.beltStyle) ao.beltStyle = a.beltStyle;
          if (a.beltRotationSpeed) ao.beltRotationSpeed = a.beltRotationSpeed;
        }
      }
      return ao;
    });
  }
  var beltAnchors = state.anchors.filter(function(a){ return a.shape === 'asteroidBelt'; });
  if (beltAnchors.length) {
    out.ringBelts = beltAnchors.map(function(a){
      var bandWidth = a.beltBandWidth || Math.max(60, Math.round(a.radius * 0.2));
      var half = bandWidth / 2;
      var belt = {
        id: a.id,
        x: a.x,
        y: a.y,
        innerRadius: Math.max(0, a.radius - half),
        outerRadius: a.radius + half,
        ringArtPath: 'graphics/planets/ring_band_' + (a.beltStyle || 'asteroids') + '.png'
      };
      if (a.beltRotationSpeed) belt.rotationSpeed = a.beltRotationSpeed;
      return belt;
    });
  }
  if (state.images.length) {
    out.staticImages = state.images.map(function(img){
      var io = { id: img.id, x: img.x, y: img.y, width: img.width, height: img.height, imagePath: img.imagePath || '' };
      if (img.rotation) io.rotation = img.rotation;
      if (img.rotationSpeed) io.rotationSpeed = img.rotationSpeed;
      return io;
    });
  }
  if (state.stars.length) {
    out.stars = state.stars.map(function(s){
      var so = { id: s.id, x: s.x, y: s.y, radius: s.radius, starType: s.starType || 'star_yellow' };
      if (s.color) so.color = s.color;
      return so;
    });
  }
  return out;
}
var currentExportTab = 'tree';
function refreshExport(){
  var text;
  if (currentExportTab === 'tree') {
    text = JSON.stringify(buildTreeExportObject(), null, '\t');
    document.getElementById('exportHint').textContent = 'Paste over data/skilltrees/ship_skill_tree.json';
  } else {
    var typesOut = state.types.map(serializeType);
    text = toTabbedJson(typesOut, 'skillTypes');
    document.getElementById('exportHint').textContent = 'Paste over data/skilltrees/skill_types.json';
  }
  document.getElementById('exportText').value = text;
}
document.querySelectorAll('.exportTab').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('.exportTab').forEach(function(t){ t.classList.remove('active'); });
    tab.classList.add('active');
    currentExportTab = tab.dataset.tab;
    refreshExport();
  });
});
document.getElementById('refreshExportBtn').addEventListener('click', refreshExport);
function saveToProject(reason){
  var tagIssues = validateTags();
  if (tagIssues.length && !confirm(tagIssues.length + ' tag issue' + (tagIssues.length > 1 ? 's' : '') + ' will fail the build:\n' +
      tagIssues.slice(0, 8).join('\n') + (tagIssues.length > 8 ? '\n...' : '') +
      '\n\nIf this browser loaded an old copy of the tree, cancel and use "Reload from disk" instead. Save anyway?')) {
    return Promise.resolve(null);
  }
  var treeText = JSON.stringify(buildTreeExportObject(), null, '\t');
  var typesOut = state.types.map(serializeType);
  var typesText = toTabbedJson(typesOut, 'skillTypes');
  return fetch('/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ types: typesText, tree: treeText })
  }).then(function(res){
    return res.json().then(function(data){ return { status: res.status, data: data }; });
  }).then(function(result){
    if (result.status === 200 && result.data.ok) {
      showToast(reason || 'Saved to project files');
    } else {
      showToast('Save failed: ' + (result.data && result.data.message ? result.data.message : 'unknown error'));
    }
    return result;
  }).catch(function(){
    showToast('Could not reach local server - run tools\\skill_tree_server.ps1, or use Copy instead');
  });
}
document.getElementById('saveToProjectBtn').addEventListener('click', function(){ saveToProject(); });

document.getElementById('copyBtn').addEventListener('click', function(){
  var ta = document.getElementById('exportText');
  ta.focus(); ta.select();
  var ok = false;
  try { if (navigator.clipboard) { navigator.clipboard.writeText(ta.value); ok = true; } } catch(e){}
  if (!ok) { try { document.execCommand('copy'); ok = true; } catch(e){} }
  showToast(ok ? 'Copied to clipboard' : 'Select-all done - press Ctrl+C');
});

document.getElementById('importBtn').addEventListener('click', function(){
  var html =
    '<div class="modalOverlay"><div class="modal" style="width:min(560px,92vw)">' +
    '<h3>Import JSON</h3>' +
    '<div class="field"><label>skill_types.json contents</label><textarea id="impTypes" style="height:100px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--text);font-family:var(--font-mono);font-size:11px;padding:8px;"></textarea></div>' +
    '<div class="field"><label>ship_skill_tree.json contents</label><textarea id="impNodes" style="height:100px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--text);font-family:var(--font-mono);font-size:11px;padding:8px;"></textarea></div>' +
    '<div class="modalBtns"><button class="smallBtn" id="mCancel3">Cancel</button><button class="smallBtn primary" id="mLoad3">Load</button></div>' +
    '</div></div>';
  var root = document.getElementById('modalRoot');
  root.innerHTML = html;
  document.getElementById('mCancel3').addEventListener('click', function(){ root.innerHTML=''; });
  document.getElementById('mLoad3').addEventListener('click', function(){
    var typesRaw = document.getElementById('impTypes').value.trim();
    var nodesRaw = document.getElementById('impNodes').value.trim();
    try {
      if (typesRaw) { var pt = JSON.parse(typesRaw); state.types = pt.skillTypes || pt; }
      if (nodesRaw) { var pn = JSON.parse(nodesRaw); state.nodes = pn.nodes || pn; state.curves = pn.connectorCurves || []; state.hiddenConnectors = pn.hiddenConnectors || []; state.anchors = pn.orbitAnchors || []; state.images = normalizeImages(pn.staticImages); state.stars = normalizeStars(pn.stars); }
      root.innerHTML = '';
      state.selectedIds = [];
      saveLocal();
      render();
      refreshInspector();
      fitToScreen();
      showToast('Imported');
    } catch(e){
      alert('Could not parse JSON: ' + e.message);
    }
  });
});

document.getElementById('resetBtn').addEventListener('click', function(){
  if (!confirm('Discard all changes in this browser and reload skill_types.json / ship_skill_tree.json from disk?')) return;
  Promise.all([
    fetch('/data/types').then(function(r){ if (!r.ok) throw new Error('types ' + r.status); return r.json(); }),
    fetch('/data/tree').then(function(r){ if (!r.ok) throw new Error('tree ' + r.status); return r.json(); })
  ]).then(function(results){
    var typesJson = results[0], treeJson = results[1];
    state.types = typesJson.skillTypes || typesJson;
    state.nodes = treeJson.nodes || treeJson;
    state.curves = treeJson.connectorCurves || [];
    state.hiddenConnectors = treeJson.hiddenConnectors || [];
    state.anchors = treeJson.orbitAnchors || [];
    state.images = normalizeImages(treeJson.staticImages);
    state.stars = normalizeStars(treeJson.stars);
    try { localStorage.removeItem('skillTreeEditor.v1'); } catch(e){}
    clearAllSelection();
    render();
    refreshInspector();
    fitToScreen();
    showToast('Reloaded from disk');
  }).catch(function(){
    showToast('Could not reach local server - run tools\\skill_tree_server.ps1 to reload from disk');
  });
});

document.getElementById('zoomIn').addEventListener('click', function(){ state.view.zoom = Math.min(3, state.view.zoom * 1.2); render(); });
document.getElementById('zoomOut').addEventListener('click', function(){ state.view.zoom = Math.max(0.08, state.view.zoom / 1.2); render(); });
document.getElementById('centerBtn').addEventListener('click', function(){ state.view.panX = 0; state.view.panY = 0; render(); });
function fitToScreen(){
  if (state.nodes.length === 0) return;
  var maxR = 100;
  state.nodes.forEach(function(n){ maxR = Math.max(maxR, Math.abs(n.x), Math.abs(n.y)); });
  var rect = canvasWrap.getBoundingClientRect();
  var avail = Math.min(rect.width, rect.height) / 2 - 60;
  state.view.zoom = Math.max(0.08, Math.min(1.5, avail / maxR));
  state.view.panX = 0; state.view.panY = 0;
  render();
}
document.getElementById('fitBtn').addEventListener('click', fitToScreen);
document.getElementById('imageEditorBtn').addEventListener('click', function(){ openImageEditorModal(); });

document.getElementById('labelsToggle').addEventListener('change', function(ev){ state.showLabels = ev.target.checked; render(); });
document.getElementById('searchBox').addEventListener('input', function(ev){ state.search = ev.target.value; render(); });

document.getElementById('themeToggle').addEventListener('click', function(){
  var root = document.documentElement;
  var cur = root.getAttribute('data-theme');
  if (cur === 'dark') { root.setAttribute('data-theme', 'light'); }
  else if (cur === 'light') { root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme', 'dark'); }
  render();
});

var PANEL_STATE_KEY = 'skillTreeEditor.panels';
var PANEL_LIMITS = {
  toolbarWidth: { min: 160, max: 480, def: 240 },
  inspectorWidth: { min: 220, max: 560, def: 320 },
  exportHeight: { min: 120, max: 520, def: 220 }
};
function loadPanelState(){
  var state = {};
  try {
    var raw = localStorage.getItem(PANEL_STATE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e){}
  for (var key in PANEL_LIMITS) {
    if (typeof state[key] !== 'number') state[key] = PANEL_LIMITS[key].def;
  }
  return state;
}
var panelState = loadPanelState();

function applyPanelState(){
  var appEl = document.querySelector('.app');
  var toolbarCollapsed = !!panelState.toolbar;
  var inspectorCollapsed = !!panelState.inspector;
  var exportCollapsed = !!panelState.export;

  document.getElementById('toolbar').classList.toggle('collapsed', toolbarCollapsed);
  document.getElementById('inspector').classList.toggle('collapsed', inspectorCollapsed);
  document.getElementById('exportBar').classList.toggle('collapsed', exportCollapsed);

  var colLeft = toolbarCollapsed ? '36px' : panelState.toolbarWidth + 'px';
  var colRight = inspectorCollapsed ? '36px' : panelState.inspectorWidth + 'px';
  var rowBottom = exportCollapsed ? '36px' : panelState.exportHeight + 'px';
  appEl.style.gridTemplateColumns = colLeft + ' 1fr ' + colRight;
  appEl.style.gridTemplateRows = '52px 1fr 1px ' + rowBottom;

  document.getElementById('toolbarToggle').textContent = toolbarCollapsed ? '?' : '?';
  document.getElementById('inspectorToggle').textContent = inspectorCollapsed ? '?' : '?';
  document.getElementById('exportToggle').textContent = exportCollapsed ? '?' : '?';
}

function savePanelState(){
  try { localStorage.setItem(PANEL_STATE_KEY, JSON.stringify(panelState)); } catch(e){}
}

document.getElementById('toolbarToggle').addEventListener('click', function(){
  panelState.toolbar = !panelState.toolbar;
  applyPanelState();
  savePanelState();
});
document.getElementById('inspectorToggle').addEventListener('click', function(){
  panelState.inspector = !panelState.inspector;
  applyPanelState();
  savePanelState();
});
document.getElementById('exportToggle').addEventListener('click', function(){
  panelState.export = !panelState.export;
  applyPanelState();
  savePanelState();
});

function setupResizeHandle(handleId, opts){
  var handle = document.getElementById(handleId);
  var dragging = false, startPos = 0, startSize = 0;
  handle.addEventListener('mousedown', function(e){
    if (opts.isCollapsed()) return;
    dragging = true;
    startPos = opts.axis === 'x' ? e.clientX : e.clientY;
    startSize = panelState[opts.key];
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  window.addEventListener('mousemove', function(e){
    if (!dragging) return;
    var pos = opts.axis === 'x' ? e.clientX : e.clientY;
    var delta = (pos - startPos) * (opts.invert ? -1 : 1);
    var limits = PANEL_LIMITS[opts.key];
    panelState[opts.key] = Math.max(limits.min, Math.min(limits.max, startSize + delta));
    applyPanelState();
  });
  window.addEventListener('mouseup', function(){
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    savePanelState();
  });
}

setupResizeHandle('toolbarResize', {
  axis: 'x', invert: false, key: 'toolbarWidth',
  isCollapsed: function(){ return !!panelState.toolbar; }
});
setupResizeHandle('inspectorResize', {
  axis: 'x', invert: true, key: 'inspectorWidth',
  isCollapsed: function(){ return !!panelState.inspector; }
});
setupResizeHandle('exportResize', {
  axis: 'y', invert: true, key: 'exportHeight',
  isCollapsed: function(){ return !!panelState.export; }
});

applyPanelState();

window.addEventListener('resize', render);

fitToScreen();
render();
refreshExport();
})();
</script>
